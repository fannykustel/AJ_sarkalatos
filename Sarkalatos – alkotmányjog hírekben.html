{id:19, rovat:"allam", lecke:19, min:5,
 title:"Menekült, menedékes, migráns: három szó, amit a köznyelv összemos, a vizsgán viszont nem szabad",
 lead:"Az állampolgárság fogalma, a hontalanság elleni két elv, és hogyan lesz valaki magyar születésével – vagy éppen az inkubátorban.",
 quote:"Senkit nem lehet megfosztani az állampolgárságától.",
 body:`<p>Az <strong>állampolgárság</strong> a legszorosabb közjogi kapcsolat egy állam és egy <strong>természetes személy</strong> között, mindkét oldalon jogokkal és kötelezettségekkel. Jogi személynek nincs állampolgársága, legfeljebb <strong>honossága</strong>. Az állampolgár joghatóság alá kerül, cserébe védelmet és jogokat kap (választójog), és kötelezettségeket (honvédelem). Külföldön diplomáciai védelem illeti meg – ha nincs magyar képviselet, bármely uniós tagállamé.</p>
<h3>Hontalanság</h3>
<p>Két nemzetközi alapelv: <strong>senkit nem lehet megfosztani az állampolgárságától</strong>, és <strong>a hontalanságot vissza kell szorítani</strong>. Az ideális: mindenki legalább egy, lehetőleg csak egy államhoz tartozzon. A többes állampolgárság bonyodalmat okoz (pl. honvédelem), ezért több ország tiltja (Ausztria, Németország, Ukrajna, Szlovákia). A német modell: megszerzéskor le kell mondani a régiről, de utána nem korlátozzák.</p>
<h3>A három fogalom</h3>
<table><thead><tr><th></th><th>Menekült</th><th>Menedékes</th><th>Migráns</th></tr></thead><tbody>
<tr><td>Alapja</td><td>nemzetközi egyezmény</td><td>kollektív jogcím</td><td>nem jogi kategória</td></tr>
<tr><td>Ki?</td><td>akit üldöznek, vagy megalapozottan tart tőle</td><td>háború miatt menekülő nagy csoport</td><td>gazdasági okból, jobb életért indul</td></tr>
<tr><td>Jelleg</td><td>egyéni, tartós</td><td>kollektív, ideiglenes</td><td>nincs alanyi jog</td></tr></tbody></table>
<p>Az üldöztetés <strong>szenzitív tulajdonsághoz</strong> kötődik: nem, faj, politikai hovatartozás, szexuális orientáció, vallás. Akit hazájában a homoszexualitása miatt halál fenyeget, már ezért menekült.</p>
<p>A <strong>családegység elve</strong> szerint törekedni kell rá, hogy egy családnak közös állampolgársága legyen.</p>
<h3>Keletkezés (nem szerzés!)</h3>
<p>Keletkezés: külön aktus nélkül jön létre. Szerzés: aktív magatartás kell.</p>
<p><strong>Születés.</strong> <em>Ius sanguinis</em> (vérségi elv): a szülő állampolgársága dönt – ezt követi Magyarország és Európa szinte egésze. <em>Ius soli</em> (területi elv): a születés helye – USA, Ausztrália; a születésturizmust minimális tartózkodási idővel védik ki. Német és magyar szülő gyermeke mindkettőt megkapja. (Adminisztratívan a születést jelezni kell.)</p>
<p>A területi elv nálunk <strong>kisegítő</strong>: a <strong>hontalan szülők</strong> itt született gyermeke, és a <strong>talált gyermek</strong> (inkubátor) magyar állampolgár. Utóbbi <strong>megdönthető vélelem</strong>: ha kiderül, kik a szülei, megdőlhet.</p>
<p><strong>Családi kötelék utólagos megállapítása:</strong> ha a bíróság megállapítja, hogy az ismeretlen apa magyar volt, a gyermek a <strong>születésére visszamenőleg</strong> magyar.</p>`,
 tldr:["Csak természetes személynek van állampolgársága","Nincs megfosztás; a hontalanságot vissza kell szorítani","Menekült egyéni-tartós, menedékes kollektív-ideiglenes, migráns nem jogi kategória","Ius sanguinis a főszabály; területi elv: hontalan szülők, talált gyermek"],
 vizsga:["Határold el a menekült, menedékes és migráns fogalmát!","Mikor érvényesül a területi elv a magyar jogban?"]},

{id:20, rovat:"allam", lecke:20, min:5,
 title:"Minden feltételnek megfeleltél, mégis elutasíthatják a honosítást. Ez nem hiba, hanem a rendszer",
 lead:"Az öt feltétel, a nyolc évből három vagy nulla, és miért honosítható az, akit külföldön házasságtörésért ítéltek el.",
 quote:"A feltételek teljesítése nem alanyi jogot, hanem lehetőséget keletkeztet.",
 body:`<p>Három megszerzési mód van: <strong>honosítás, visszahonosítás, nyilatkozattétel</strong>.</p>
<h3>A honosítás öt feltétele</h3>
<p><strong>1. Nyolc év magyarországi tartózkodás</strong>, amely csökkenhet:</p>
<table><thead><tr><th>Idő</th><th>Kire?</th></tr></thead><tbody>
<tr><td>5 év</td><td>itt született, vagy kiskorúként került ide</td></tr>
<tr><td>3 év</td><td>menekült; magyar házastárs; magyar állampolgár fogadta örökbe vagy ő fogad örökbe magyart</td></tr>
<tr><td>0 év</td><td>állami érdekből (pl. sportolók); kedvezményes honosítás magyar származás és nyelvtudás esetén (2010 óta)</td></tr></tbody></table>
<p><strong>2. Bejelentett lakóhely és megélhetés</strong> – kivéve a kedvezményes és az állami érdekű honosítást.</p>
<p><strong>3. Nem sérti a nemzetbiztonságot és a közbiztonságot.</strong></p>
<p><strong>4. Büntetlen előélet</strong>, és nincs ellene büntetőeljárás – mindkettő <strong>a magyar jog szerint</strong>. Külföldi eljárás nem kizáró ok; magyarországi igen. Külföldön házasságtörésért elítélt honosítható (nálunk nem bűncselekmény), emberölésért elítélt nem.</p>
<p><strong>5. Állampolgársági vizsga</strong> magyarul. Mentes: kiskorú, 65 év feletti, magyar nyelvű felsőfokú végzettségű, házastársi jogcímen honosított.</p>
<p class="kiemel">A 3. és a 4. feltétel alól <strong>nem adható felmentés</strong>.</p>
<h3>Ki dönt?</h3>
<p>A kérelem az <strong>Országos Idegenrendészeti Főigazgatósághoz</strong> megy, a döntést a <strong>köztársasági elnök</strong> hozza. Megtagadhatja akkor is, ha minden feltétel teljesül: az állampolgárság <strong>szuverenitási kérdés</strong>, nem alanyi jog – és nincs jogorvoslat. (Az előadó szerint ezt vizsgán már kérdezték.)</p>
<h3>Megszűnés</h3>
<ul><li><strong>Lemondás</strong> – pl. ha a másik állampolgárság megköveteli;</li><li><strong>visszavonás</strong> – csalással szerzett állampolgárság, <strong>tíz éven belül</strong>;</li><li><strong>megfosztás nem lehetséges.</strong></li></ul>
<p><strong>Visszahonosítás:</strong> aki már volt magyar, és újra az akar lenni – tipikusan, ha lemondott, de a másikat nem kapta meg. Ha megkapta, és utóbb akarja vissza a magyart, az rendes honosítás.</p>
<p><strong>Nyilatkozattétel:</strong> akit a kommunista rendszer büntetésből fosztott meg, illetve az 1957 előtti szabály érintettjei (akkor csak a magyar apa gyermeke lett magyar). Itt <strong>az állam nem mérlegel</strong>.</p>
<p><strong>Felfüggesztés:</strong> új jogintézmény az államot veszélyeztető személyre – nem szűnik meg, de a jogok nem gyakorolhatók. Vitatott: több nemzetközi egyezménnyel ellentétes, és soha nem alkalmazták.</p>`,
 tldr:["Honosítás, visszahonosítás, nyilatkozattétel","Öt feltétel; a 3. és 4. alól nincs felmentés","Büntetlenség a magyar jog szerint","KE dönt, megtagadhatja, nincs jogorvoslat","Megszűnés: lemondás, visszavonás (10 év); megfosztás nincs"],
 vizsga:["Sorold fel a honosítás feltételeit és a kivételeket!","Megtagadhatja-e a KE a honosítást, ha minden feltétel teljesül?"]},

{id:21, rovat:"allam", lecke:21, min:5,
 title:"Tizenhárom nemzetiség, és miért nem került be a székely",
 lead:"Kiket illetnek a nemzetiségi jogok, mi az elismerés két feltétele, és miért vált a szabad identitásvállalás néha szabad identitásválasztássá.",
 quote:"A kontroll bevezetése rosszabb, mint a visszaélés eltűrése.",
 body:`<p>A <strong>nemzetiség</strong> az országban élő közösség, amelyet számbeli kisebbség és saját nyelv, kultúra, hagyomány jellemez. A nemzetiségek Magyarországon <strong>államalkotó tényezők</strong> – részben a trianoni örökség miatt: ha elvárjuk a szomszédoktól a határon túli magyarok tisztességes kezelését, nekünk is példát kell mutatnunk.</p>
<p class="kiemel">A nemzetiségi jogok <strong>a más identitású magyar állampolgárokat</strong> illetik meg. A Kecskeméten élő német állampolgárokat nem; a magyar állampolgár svábokat igen.</p>
<h3>Az elismerés</h3>
<p>Két feltétel: <strong>legalább száz éve honos</strong>, és <strong>saját nyelve, kultúrája, hagyománya</strong> van. A másodikról az <strong>MTA</strong> ad állásfoglalást, a döntést az <strong>Országgyűlés</strong> hozza (a nemzetiségi törvény mellékletében). A székelyek kérelmét elutasították: asszimilálódtak, a magyarság részei.</p>
<p><strong>A 13 nemzetiség.</strong> Szomszédos népek (7): szlovák, ukrán, román, szerb, horvát, szlovén, német. Történelmi alapon (6): lengyel, örmény, görög, ruszin, bolgár, roma. (A ruszin nem azonos az ukránnal; a görögöknek saját többségi településük is van: Beloiannisz.)</p>
<h3>Szabad identitásvállalás</h3>
<p>A hovatartozás kizárólag <strong>önbevalláson</strong> alapul, senki nem kényszeríthető, hatóság nem vizsgálhatja felül. Amerikában vagy Kanadában az őslakos identitás bíróság előtt is vizsgálható; Európában a náci etnikai listázások és a numerus clausus után ez elképzelhetetlen.</p>
<p>Az ára: a vállalás <strong>választássá</strong> válhat – voltak, akik a nemzetiségi önkormányzati támogatásért vagy egy pozitív diszkriminációs felvételi helyért vallották magukat valaminek. A dilemma feloldhatatlan.</p>
<h3>A jogok</h3>
<p><strong>Egyéni:</strong> névhasználat (a nemzetiségi névkönyvből is), nyelvhasználat az eljárásokban. <strong>Kollektív:</strong> 25% felett kétnyelvű táblák és intézménynevek; saját ünnepek; iskola, óvoda; és a legfontosabb: <strong>nemzetiségi önkormányzat</strong> (települési, vármegyei, országos szinten, közvetlen választással).</p>
<p>Választani akkor lehet, ha a legutóbbi <strong>népszámláláson</strong> legalább <strong>harmincan</strong> vallották magukat az adott nemzetiséghez tartozónak – a visszaélések kiszűrésére vezették be, ára, hogy tíz év alatt sokat változhat egy település. Létszám: száz fő alatt 3, felette 5 képviselő.</p>
<h3>Nemzeti jelképek</h3>
<p>Himnusz, zászló, címer – az Alaptörvény Alapvetésében, büntetőjogi védelemmel.</p>`,
 tldr:["Államalkotó tényezők; csak magyar állampolgárokat illet","100 év + saját nyelv, kultúra; MTA → OGY","13 nemzetiség: 7 szomszédos + 6 történelmi","Önbevallás, nincs kontroll","Nemzetiségi önkormányzat: népszámlálás, min. 30 fő"],
 vizsga:["Mik az elismerés feltételei, és miért nem nemzetiség a székely?","Sorold fel az egyéni és kollektív nemzetiségi jogokat!"]},

{id:22, rovat:"jogforras", lecke:22, min:5,
 title:"Az Alaptörvény nem jogszabály. Ez a vizsgák egyik legklasszikusabb csapdája",
 lead:"Norma, jogforrás, jogszabály – és a Kelsen-féle piramis, amelynek csúcsán az Alaptörvény áll, de nem a jogszabályok között.",
 quote:"Minden jogszabály norma, de nem minden norma jogszabály.",
 body:`<p>Mi a jog? A legtöbben azt mondják: kötelező magatartási szabály. <strong>Ez nem a jog fogalma.</strong> A klasszikus meghatározás szerint a jog <em>a jó és a méltányos művészete</em>. Amit a köznyelv jognak hív, az valójában a <strong>norma</strong>.</p>
<h3>A három alapfogalom</h3>
<ul><li><strong>Norma:</strong> kötelező, általános magatartási szabály, amelyet állami szerv alkot, és közvetlenül kikényszeríthető.</li>
<li><strong>Jogforrás:</strong> amiből a norma megismerhető.</li>
<li><strong>Jogszabály:</strong> a normánál szűkebb: azok, amelyeket az Alaptörvény <strong>T) cikke</strong> jogszabálynak tételez.</li></ul>
<p>Mint a bogár és a rovar: minden jogszabály norma, de nem minden norma jogszabály.</p>
<h3>Kelsen piramisa</h3>
<p><strong>Hans Kelsen</strong> szerint a normák hierarchikus rendbe illeszkednek, és ez biztosítja a jogrendszer zártságát. Ő mondta ki azt is, hogy a hierarchia őrzésére külön szerv kell: az <strong>alkotmánybíróság</strong>, a „negatív jogalkotó”.</p>
<h3>R) és T)</h3>
<p>Az <strong>R) cikk</strong> szerint az Alaptörvény <strong>a jogrendszer alapja</strong>. A <strong>T) cikk</strong> felsorolja a jogszabályokat – és az Alaptörvény <strong>nincs köztük</strong>.</p>
<ol class="piramis"><li>Alaptörvény (nem jogszabály!)</li><li>törvény</li><li>kormányrendelet = MNB-elnöki rendelet</li><li>miniszteri rendelet = miniszterelnöki rendelet</li><li>önálló szabályozó szervek rendeletei</li><li>önkormányzati rendelet</li><li>közjogi szervezetszabályozó eszközök, bírósági jogfejlesztő döntések</li></ol>
<p>Az önálló szabályozó szervek nemzetközi kötelezettség miatt függetlenek a kormánytól (pl. média, hírközlés).</p>
<h3>A három törvényszerűség</h3>
<ol class="lanc"><li>Alacsonyabb norma <strong>nem lehet ellentétes</strong> a magasabbal – különben érvénytelen.</li><li>Jogszabályt csak <strong>azonos vagy magasabb</strong> szintű módosíthat (kormányrendeletet miniszteri rendelet nem).</li><li>Alacsonyabb normában <strong>tilos megismételni</strong> a magasabb szabályát (Jat.).</li></ol>
<p>Ezért nem találod az Ákr. alapelvei között a tisztességes hatósági eljáráshoz való jogot: az Alaptörvény <strong>XXIV. cikkében</strong> van, és megismételni sem szabad.</p>`,
 tldr:["Norma ⊃ jogszabály","Kelsen: piramis + alkotmánybíróság","R): az Alaptörvény az alap; T): a jogszabályok listája","Kormányrendelet = MNB-rendelet; miniszteri = ME-rendelet","Nincs ellentét, csak felülről módosítás, nincs ismétlés"],
 vizsga:["Jogszabály-e az Alaptörvény?","Rajzold fel a magyar jogforrási hierarchiát!","Mi a hierarchiából fakadó három törvényszerűség?"]},

{id:23, rovat:"jogforras", lecke:23, min:4,
 title:"A sarkalatos törvény nem erősebb a többinél – csak nehezebb elfogadni",
 lead:"Ki alkothat törvényt, miről kell, és miért nem az egész salátatörvény sarkalatos. Három többség, amit sokan összekevernek.",
 quote:"Ami egyszer törvény volt, annak onnantól mindig törvénynek kell lennie.",
 body:`<p><strong>Törvényt kizárólag az Országgyűlés alkothat.</strong> A kommunista időszakban a Népköztársaság Elnöki Tanácsa törvényerejű rendeleteket adott ki; ezt az 1987. évi XI. törvény zárta le. Érdekesség: néhány törvényerejű rendelet ma is hatályos (régi nemzetközi egyezmények kihirdetései).</p>
<h3>Miről lehet és miről kell?</h3>
<p>Lehet: <strong>bármiről</strong>. Kell: ez a kérdés. A régi Jat. felsorolta, de az AB megsemmisítette, mert törvényben nem lehet meghatározni, miről kell törvényt alkotni (körkörös). A kötelező tárgykörök az <strong>Alaptörvényben</strong> vannak:</p>
<ol class="lanc"><li><strong>sarkalatos tárgykörök</strong> (AB, választójog, Országgyűlés…);</li><li><strong>alapvető jogok és kötelezettségek</strong> – alapjogot csak törvény korlátozhat (kivétel: különleges jogrend);</li><li><strong>költségvetés</strong> és zárszámadás;</li><li><strong>amiről korábban törvény rendelkezett</strong>.</li></ol>
<h3>Három típus</h3>
<table><thead><tr><th>Típus</th><th>Többség</th><th>Példa</th></tr></thead><tbody>
<tr><td>egyszerű</td><td>a határozatképes OGY (több mint felük jelen) több mint fele</td><td>Btk., Ptk.</td></tr>
<tr><td>sarkalatos</td><td>a <strong>jelen lévő</strong> képviselők kétharmada</td><td>választójogi tv., AB-törvény</td></tr>
<tr><td>alkotmányos többségű</td><td>az <strong>összes</strong> képviselő kétharmada</td><td>nemzetközi szerződést kihirdető törvények</td></tr></tbody></table>
<p class="kiemel">Közöttük <strong>nincs hierarchia</strong> – a sarkalatos törvény ugyanazon a szinten áll, mint az egyszerű.</p>
<h3>Tárgykör, nem törvény</h3>
<p>Az Alaptörvény sarkalatos <strong>tárgykörről</strong> beszél. Van, ami teljesen sarkalatos (választójogi törvény), de gyakran csak egy rész. A <strong>salátatörvény</strong> egyszerre több törvényt módosít; ha sarkalatos tárgykört is érint, csak az a rész lesz sarkalatos, és <strong>többlépcsős szavazás</strong> kell: előbb a sarkalatos részről kétharmaddal, aztán az egészről.</p>`,
 tldr:["Csak az OGY alkothat törvényt","4 kötelező tárgykör: sarkalatos, alapjog, költségvetés, ami már törvény volt","Egyszerű / sarkalatos (jelenlévők 2/3) / alkotmányos (összes 2/3)","Nincs hierarchia köztük","Salátatörvény: csak a sarkalatos rész kétharmados"],
 vizsga:["Sorold fel a kötelező törvényalkotási tárgyköröket!","Ismertesd a három törvénytípust! Van-e köztük hierarchia?"]},

{id:24, rovat:"jogforras", lecke:24, min:4,
 title:"Secundum, praeter, contra: a miniszter rendelete, ami túllépett a felhatalmazáson",
 lead:"A törvény csak az irányt adja, a részleteket a rendelet bontja ki. De kinek, mire, és mi van, ha valaki felhatalmazás nélkül szabályoz?",
 quote:"A jó jogszabály nem hosszú és részletes, hanem általános.",
 body:`<p>A törvény <strong>generálklauzulás</strong>: csak a legfontosabb kérdéseket rendezi. Az elrettentő példa az osztrák <strong>ABGB</strong>, amely mindent szabályozni akart, és átláthatatlan lett. A részleteket a rendelet bontja ki – <strong>a rendelet fő funkciója a végrehajtás</strong>.</p>
<h3>Származékos (végrehajtási) rendelet</h3>
<p>Alapja a törvényben lévő <strong>felhatalmazó rendelkezés</strong>, amely két kérdésre felel: <strong>kit</strong> és <strong>mire</strong> hatalmaz fel. Csak a felhatalmazott szerv alkothatja, csak a felhatalmazás keretein belül.</p>
<p><strong>Példa:</strong> a választási eljárási törvény felhatalmazza az igazságügyért felelős minisztert, hogy rendeletben szabályozza a választási határidőket.</p>
<ul><li><em>Secundum legem</em> – csak a határidőket szabályozza: <strong>ideális</strong>.</li><li><em>Praeter legem</em> – a határidőkön túl mást is: <strong>aggályos</strong>.</li><li><em>Contra legem</em> – egészen másról szól: <strong>kizárt, érvénytelen</strong>.</li></ul>
<h3>Miért „felelős miniszter”?</h3>
<p>A felhatalmazás a <strong>feladatkört</strong> jelöli meg, nem a minisztériumot – mert a kormánynak <strong>szervezetalakítási szabadsága</strong> van. Különben minden kormányalakításkor át kellene írni az összes felhatalmazást. Hogy ki melyik feladatkört viszi, a <strong>statútumrendeletből</strong> derül ki.</p>
<h3>Eredeti jogalkotói hatáskör</h3>
<p>Felhatalmazás nélkül, közvetlenül az Alaptörvény alapján – ha <strong>nincs róla törvény</strong>, és a kérdés <strong>a szerv feladatkörébe tartozik</strong>. Két szervnek van ilyen joga:</p>
<table><thead><tr><th>Ki?</th><th>Alap</th><th>Kör</th></tr></thead><tbody><tr><td>kormány</td><td>15. cikk</td><td>általános hatáskör, gyakorlatilag minden</td></tr><tr><td>helyi önkormányzat</td><td>32. cikk</td><td>szűk, pl. helyi tüzelőtámogatás</td></tr></tbody></table>
<p>Eredeti hatáskörben <strong>nincs rendeletalkotási kötelezettség</strong> – szemben a származékossal.</p>`,
 tldr:["Törvény: általános; rendelet: végrehajtás","Felhatalmazás: kit és mire","Secundum ideális, praeter aggályos, contra kizárt","Feladatkör, nem minisztérium → statútumrendelet","Eredeti hatáskör: kormány (15. cikk), önkormányzat (32. cikk)"],
 vizsga:["Mi a felhatalmazó rendelkezés két eleme?","Mi a secundum, praeter és contra legem rendelet?","Kinek van eredeti jogalkotói hatásköre?"]},

{id:25, rovat:"jogforras", lecke:25, min:5,
 title:"Az autót eladtad, a házastársad szerint nem lehetett volna. A vevőt nem érdekli – és a másik államot sem",
 lead:"Dualizmus vagy monizmus? A nemzetközi szerződés az Alaptörvény fölött áll, az uniós rendelet közvetlenül hat, az irányelv viszont lopakodik.",
 quote:"Pacta sunt servanda – a szerződéseket be kell tartani.",
 body:`<table><thead><tr><th></th><th>Dualista</th><th>Monista</th></tr></thead><tbody><tr><td>Gondolat</td><td>két külön tér, fal van köztük</td><td>egy tér</td></tr><tr><td>Belső jog lesz</td><td>transzformációval, kihirdetéssel</td><td>automatikusan</td></tr></tbody></table>
<p>Az Alaptörvény <strong>Q) cikke</strong> <strong>alapvetően dualista</strong>: a nemzetközi jog kihirdetéssel lesz belső jog. De a <strong>nemzetközi jog általánosan elismert szabályai</strong> kihirdetés nélkül is köteleznek – a népirtás, az apartheid, a kínzás tilalma. Vagyis: dualista, <strong>monista elemmel</strong>.</p>
<h3>Hol áll a nemzetközi szerződés?</h3>
<p><strong>Az Alaptörvény fölött.</strong> Két érv:</p>
<p><strong>Pacta sunt servanda.</strong> Eladod az autódat, otthon a házastársad közli, hogy a köztetek lévő megállapodás szerint nem tehetted volna. A vevőt a belső szabályod nem érdekli. Ugyanígy a másik államot sem érdekli, mit mond a saját alkotmányunk.</p>
<p><strong>Önkorlátozás.</strong> A szerződéssel az állam maga korlátozza szuverenitását (pl. a közös védelmi rendszerben idegen gépek engedély nélkül léphetnek a légtérbe).</p>
<p class="kiemel">Ellentmondás esetén <strong>az Alaptörvényt kell módosítani</strong> – így történt a NATO- és az EU-csatlakozás előtt. Ennek eredménye az <strong>E) cikk, az Európa-klauzula</strong>.</p>
<h3>Rendelet és irányelv</h3>
<table><thead><tr><th></th><th>Uniós rendelet</th><th>Uniós irányelv</th></tr></thead><tbody><tr><td>Hatály</td><td>közvetlen</td><td>nincs közvetlen hatálya</td></tr><tr><td>Teendő</td><td>semmi, alkalmazzuk</td><td>jogharmonizáció</td></tr><tr><td>Hierarchia</td><td>nem kell elhelyezni</td><td>a belső jogszabályokban jelenik meg</td></tr></tbody></table>
<p>Vámügyben a magyar hatóság közvetlenül az uniós rendeletet alkalmazza; magyar törvény ott nem is születhet.</p>
<p>Az irányelv a <strong>„lopakodó föderalizmus”</strong> (Szabó Marcel kifejezése): közös irányt ad, amihez a tagállam a saját szabályait igazítja – nem kihirdeti, hanem módosítja mindazt, ami nem fér össze vele. Ha elmulasztja, a <strong>Bizottság kötelezettségszegési eljárást</strong> indít, az <strong>EU Bírósága</strong> megállapítja a jogsértést, és bírság jön.</p>`,
 tldr:["Q) cikk: dualista, monista elemmel","Általánosan elismert szabályok: kihirdetés nélkül","Nemzetközi szerződés > Alaptörvény (pacta sunt servanda, önkorlátozás)","E) cikk: Európa-klauzula","Rendelet közvetlen; irányelv: jogharmonizáció"],
 vizsga:["Dualista vagy monista a magyar jog?","Hol helyezkedik el a nemzetközi szerződés az Alaptörvényhez képest?","Mi a különbség az uniós rendelet és irányelv között?"]},

{id:26, rovat:"jogforras", lecke:26, min:4,
 title:"Nem jogszabály, mégis kötelező: a Házszabálytól a Kúria jogegységi határozatáig",
 lead:"A normák egy része a jogszabályokon kívül esik. Befelé hatnak – néha mégis kifelé is.",
 quote:"A Házszabály tipikusan intraneus norma, amelynek külső hatása van.",
 body:`<h3>Közjogi szervezetszabályozó eszközök</h3>
<p>Nem jogszabályok, hanem egy állami szerv <strong>belső működését</strong> szabályozzák: SZMSZ, közszolgálati, iratkezelési, adatkezelési szabályzat.</p>
<p><strong>Extraneus</strong> norma: kifelé szabályoz (jogszabály). <strong>Intraneus</strong> norma: befelé hat (szervezetszabályozó eszköz).</p>
<table><thead><tr><th>Típus</th><th>Ki adja ki?</th></tr></thead><tbody><tr><td>normatív utasítás</td><td>egyszemélyi vezetésű szerv (pl. minisztérium)</td></tr><tr><td>normatív határozat</td><td>testületi szerv (pl. OGY, AB)</td></tr></tbody></table>
<p>A legismertebb a <strong>Házszabály</strong> (országgyűlési határozat). Befelé hat, de külső hatása is van: betartása a törvények <strong>érvényességi követelménye</strong>.</p>
<h3>A bíróságok jogfejlesztése</h3>
<p>A bíróság jogalkalmazó, nem jogalkotó – két döntési formának mégis normatív hatása van.</p>
<p><strong>A Kúria jogegységi határozata.</strong> Nálunk nincs precedensrendszer, de ha a gyakorlat szétágazik, a Kúria kötelező szempontokat határoz meg, amelyektől a bíróságok nem térhetnek el. <strong>Kvázi jogforrás.</strong> Alkotmányjogi panasz alapján az AB meg is semmisítheti.</p>
<p><strong>Az AB alkotmányos követelménye.</strong> Az AB kelseni értelemben negatív jogalkotó (megsemmisít). De ha nem a jogszabály, hanem annak <strong>bírói értelmezése</strong> okozza a problémát, nem semmisít, hanem kimondja, hogyan kell értelmezni – onnantól csak ez az értelmezés alaptörvény-konform. Ez is kötelező, tehát kvázi jogforrás.</p>`,
 tldr:["Szervezetszabályozó eszköz: belső működés","Intraneus (befelé) vs. extraneus (kifelé)","Normatív utasítás: egyszemélyi; normatív határozat: testületi","Házszabály: érvényességi feltétel","Jogegységi határozat és alkotmányos követelmény: kvázi jogforrás"],
 vizsga:["Mi a közjogi szervezetszabályozó eszköz, és mi a két típusa?","Miért van a Házszabálynak külső hatása?","Mi az alkotmányos követelmény?"]},

{id:27, rovat:"jogforras", lecke:27, min:6,
 title:"„Érvénybe lépett”? Ilyen nincs. Ami hatályba lép, az működik – ami érvényes, az csak alkalmas",
 lead:"Négy érvényességi feltétel, négy hatályfajta, fél óra és három év felkészülési idő, és miért szabad visszamenőleg adót csökkenteni, de emelni nem.",
 quote:"Az érvényesség az alkalmasság, a hatályosság a működés.",
 body:`<p><strong>Érvényesség:</strong> a jogszabály <em>alkalmas</em> a joghatás kifejtésére. <strong>Hatályosság:</strong> <em>ténylegesen kifejti</em>. Ezért hibás a sajtó kedvenc fordulata: „érvénybe lépett” nem létezik, legfeljebb hatályba.</p>
<h3>A négy érvényességi feltétel</h3>
<ol class="lanc"><li>Az arra <strong>felhatalmazott szerv</strong> alkossa.</li><li>Az <strong>előírt eljárásban</strong> – különben közjogi érvénytelenség.</li><li><strong>Illeszkedjen a hierarchiába</strong>.</li><li><strong>Ki kell hirdetni.</strong></li></ol>
<table><thead><tr><th></th><th>Kihirdetés</th><th>Közzététel</th></tr></thead><tbody><tr><td>Mire?</td><td>jogszabályra</td><td>minden más normára</td></tr><tr><td>Jelentőség</td><td>érvényességi feltétel</td><td>csak jogbiztonság</td></tr><tr><td>Hol?</td><td>Magyar Közlöny; önkormányzati rendeletnél helyben szokásos módon</td><td>–</td></tr></tbody></table>
<p><strong>Érvényesség vélelme:</strong> ami megjelent a Magyar Közlönyben, azt érvényesnek vélelmezzük. Ha a belügyminiszter adja ki az igazságügyi miniszternek szóló felhatalmazás alapján járó rendeletet, az sem automatikusan érvénytelen – a vélelmet az <strong>Alkotmánybíróság</strong> döntheti meg.</p>
<h3>A hatály négy fajtája</h3>
<p><strong>Tárgyi</strong> (miről), <strong>területi</strong> (hol), <strong>személyi</strong> (kire), <strong>időbeli</strong> (mikortól meddig).</p>
<h3>Vacatio legis</h3>
<p>Felkészülési idő kell – de mennyi? Védett üzemanyagár kivezetése: <strong>fél óra</strong> (különben felvásárlás). Ptk.: <strong>másfél év</strong>. Elektronikus ingatlan-nyilvántartás: <strong>közel három év</strong>. Hogy elég-e, azt az AB ítéli meg. A hatálybalépésnek <strong>fix, meghatározható</strong> időponthoz kell kötődnie. <strong>Nulla felkészülési idő nincs</strong>: aznapi hatálybalépésnél óra-perc pontossággal kell megadni (a Közlöny időbélyegzővel jelenik meg).</p>
<h3>Önderogáció</h3>
<p>A módosító szabály beépül az eredetibe, majd a Jat. szerint <strong>automatikusan hatályon kívül helyezi önmagát</strong>. Következmény: ha a módosítás alaptörvény-ellenes, az AB nem tudja visszaállítani az eredetit – csak a módosított eredetit semmisítheti meg, amely így kiürül.</p>
<h3>A visszaható hatály tilalma</h3>
<p>Hátrányos rendelkezés nem vonatkozhat a hatálybalépés előtti időre. Tilos visszamenőleg:</p>
<ul><li><strong>új kötelezettséget</strong> megállapítani (új adónem januártól);</li><li>meglévőt <strong>terhesebbé</strong> tenni (adóemelés januártól);</li><li><strong>jogot elvonni</strong> (nyugdíjba vonultak visszaküldése dolgozni).</li></ul>
<p class="kiemel"><strong>Pozitív irányban szabad:</strong> visszamenőleges adócsökkentés, jog visszaadása megengedett.</p>`,
 tldr:["Érvényesség = alkalmasság; hatályosság = működés","4 feltétel: szerv, eljárás, hierarchia, kihirdetés","Érvényesség vélelme – csak az AB döntheti meg","Hatály: tárgyi, területi, személyi, időbeli","Vacatio legis nem lehet nulla","Visszaható hatály: negatív tilos, pozitív szabad"],

{s1:"Törvényt kizárólag az Országgyűlés alkothat,",s2:"a kötelező törvényalkotási tárgyköröket a jogalkotási törvény sorolja fel.",a:2,c:23,e:"A felsorolást az AB megsemmisítette; a kötelező tárgykörök az Alaptörvényben vannak."},
{s1:"A kormány felhatalmazás nélkül is alkothat rendeletet,",s2:"az Alaptörvény 15. cikke alapján eredeti jogalkotói hatásköre van.",a:0,c:24,e:"Ha nincs törvény, és a kérdés a feladatkörébe tartozik."},
{s1:"Az uniós irányelvet a magyar bíróság átültetés nélkül alkalmazza,",s2:"az irányelv közvetlen hatályú.",a:4,c:25,e:"Az irányelvnek nincs közvetlen hatálya – jogharmonizáció kell; a rendelet közvetlen hatályú."},
{s1:"Visszamenőleg is lehet adót csökkenteni,",s2:"a visszaható hatály tilalma csak a hátrányos rendelkezésekre vonatkozik.",a:0,c:27,e:"Pozitív irányban szabad visszamenni."},
{s1:"A közzététel érvényességi feltétel,",s2:"a jogszabályt a Magyar Közlönyben ki kell hirdetni.",a:3,c:27,e:"Érvényességi feltétel a kihirdetés (jogszabálynál); a közzététel csak a jogbiztonságot szolgálja."}
].map(x=>({...x,t:"ra"}));


const ROVAT = {
  alapok:{nev:"Alapok", leir:"Közjog és magánjog, az alkotmány fogalma, típusai, születése"},
  alkotmanyossag:{nev:"Alkotmányosság", leir:"Demokrácia, pluralizmus, jogállam, hatalommegosztás"},
  tortenelem:{nev:"Történelem", leir:"Aranybullától az Alaptörvényig"},
  allam:{nev:"Állam", leir:"Szuverenitás, terület, államszerkezet, állampolgárság, nemzetiségek"},
  jogforras:{nev:"Jogforrások", leir:"Hierarchia, törvény, rendelet, nemzetközi jog, érvényesség"}
};
const ART = [...A1, ...A2, ...A3].sort((a,b)=>a.id-b.id);
const byId = Object.fromEntries(ART.map(a=>[a.id,a]));
const TICK = [
 ["100 km","a Kármán-vonal – itt ér véget a légtér"],["13","elismert nemzetiség Magyarországon"],["8 év","a honosítás főszabálya – lehet 5, 3 vagy 0"],
 ["2/3","a jelen lévők kétharmada: sarkalatos; az összeseké: alkotmányos többség"],["200 tengeri mérföld","a szárazföldi lemez végétől"],["1989. évi XXXI.","ideiglenesnek szánt, húsz évig élő alkotmány"],
 ["2012. jan. 1.","az Alaptörvény hatálybalépése"],["R) cikk","az Alaptörvény nem jogszabály, hanem a jogrendszer alapja"],["10 év","ennyi időn belül vonható vissza a csalással szerzett állampolgárság"],["30 fő","népszámlálási minimum a nemzetiségi önkormányzati választáshoz"]
];

/* storage – guarded, per-viewer convenience only */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let read = new Set(store.get("sark-read",[]));
const saveRead = ()=>store.set("sark-read",[...read]);

const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cvar = r=>`style="--c:var(--${r})"`;

function tagHTML(a){return `<span class="tag" ${cvar(a.rovat)}>${ROVAT[a.rovat].nev}</span>`}
function metaHTML(a){return `<span class="meta"><span>${a.lecke}. lecke</span><span>${a.min} perc</span>${read.has(a.id)?'<span class="done">✓ Elolvastad</span>':''}</span>`}

function renderChrome(route){
  document.getElementById("nav").innerHTML = Object.entries(ROVAT).map(([k,v])=>
    `<a href="#${k}" ${route===k?'aria-current="page"':''}><span class="dot" style="background:var(--${k})"></span>${v.nev}</a>`).join("");
  document.getElementById("prog").textContent = `${read.size}/${ART.length} cikk elolvasva`;
}
function renderTicker(){
  const one = TICK.map(([b,t])=>`<span><strong>${esc(b)}</strong>${esc(t)}</span>`).join("");
  document.getElementById("ticker").innerHTML = one + `<span aria-hidden="true" style="display:contents">${one}</span>`;
}

function card(a,big){return `<a class="card${big?' big':''}" href="#c${a.id}" ${cvar(a.rovat)}>${tagHTML(a)}<h3>${esc(a.title)}</h3><p>${esc(a.lead)}</p>${metaHTML(a)}</a>`}

function home(){
  const top = byId[13];
  const exam = [6,22,19,25,27];
  let h = `<section class="hero">
    <div class="lead-story"><a href="#c${top.id}" ${cvar(top.rovat)}>${tagHTML(top)}<h1>${esc(top.title)}</h1><p>${esc(top.lead)}</p>${metaHTML(top)}</a><section class="short" ${cvar(top.rovat)}><h2>Röviden</h2><ul>${top.tldr.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section></div>
    <div class="side"><h2>Vizsgán ezt kérdezik</h2><ol>${exam.map(id=>{const a=byId[id];return `<li><div><a href="#c${id}">${esc(a.title)}</a><small>${ROVAT[a.rovat].nev}, ${a.lecke}. lecke</small></div></li>`}).join("")}</ol>
      <div class="zh"><h3>November 7.: ZH az előadás után</h3><p>30 pontos teszt: feleletválasztós és relációanalízis-feladatok. 70% felett írhatsz megajánlott jegyért (70% = 4, 85% = 5).</p><a class="btn fill" href="#kviz">Próbaírás</a></div>
    </div></section>
    <div class="search" style="margin-top:28px"><label for="q" class="sr" style="position:absolute;left:-9999px">Keresés a cikkek között</label><input id="q" type="search" placeholder="Keresés: Kármán, honosítás, sarkalatos…" autocomplete="off"></div>
    <div id="results"></div>`;
  for(const [k,v] of Object.entries(ROVAT)){
    const list = ART.filter(a=>a.rovat===k);
    h += `<section class="sec" ${cvar(k)}><div class="sec-h"><h2>${v.nev}</h2><a href="#${k}">Mind a ${list.length} cikk</a></div><div class="grid">${list.slice(0,4).map((a,i)=>card(a,i===0)).join("")}</div></section>`;
  }
  return h;
}
function section(k){
  const v=ROVAT[k], list=ART.filter(a=>a.rovat===k);
  return `<section class="sec" ${cvar(k)} style="border:none;padding-top:8px"><div class="sec-h"><h2>${v.nev}</h2></div><p style="color:var(--ink-2);margin-top:-6px">${v.leir}</p><div class="grid">${list.map((a,i)=>card(a,i===0)).join("")}</div></section>`;
}
function article(id){
  const a=byId[id]; if(!a) return home();
  const prev=byId[id-1], next=byId[id+1];
  const rel=ART.filter(x=>x.rovat===a.rovat&&x.id!==a.id).slice(0,5);
  return `<div class="art" ${cvar(a.rovat)}><article>
    <header>${tagHTML(a)}<h1>${esc(a.title)}</h1><p class="lead">${esc(a.lead)}</p>${metaHTML(a)}</header>
    <section class="short"><h2>Röviden</h2><ul>${a.tldr.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>
    <div class="body">${a.body}</div>
    <blockquote class="pull">${esc(a.quote)}</blockquote>
    <section class="exam"><h2>Vizsgán így kérdezik</h2><ul>${a.vizsga.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>
    <button class="btn ${read.has(a.id)?'':'fill'} mark-read" id="markread">${read.has(a.id)?'✓ Elolvastad – visszavonás':'Megjelölöm elolvasottként'}</button>
    <nav class="artfoot" aria-label="Lapozás">${prev?`<a href="#c${prev.id}"><small>Előző lecke</small>${esc(prev.title)}</a>`:'<span></span>'}${next?`<a href="#c${next.id}" style="text-align:right"><small>Következő lecke</small>${esc(next.title)}</a>`:''}</nav>
  </article>
  <aside class="rail"><h2>Még a rovatból</h2>${rel.map(r=>`<a href="#c${r.id}">${esc(r.title)}<small>${r.lecke}. lecke</small></a>`).join("")}</aside></div>`;
}

/* quiz */
let Q=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function newQuiz(mode){
  mode=mode||"zh";
  const pool = mode==="ra" ? shuffle(RA).slice(0,15) : shuffle([...shuffle(QUIZ).slice(0,22),...shuffle(RA).slice(0,8)]);
  Q={mode,items:pool,pos:0,answers:[]};
}
function quiz(){
  if(!Q) newQuiz();
  if(Q.pos>=Q.items.length) return quizResult();
  const it=Q.items[Q.pos], ans=Q.answers[Q.pos];
  const pct=Math.round(Q.pos/Q.items.length*100);
  const opts = it.t==="ra" ? RA_OPTS : it.o;
  return `<div class="quiz"><span class="tag" style="--c:var(--ink)">ZH-próba</span><h1>Hány pontot írnál most?</h1>
  <div class="modes"><button class="btn ${Q.mode==="zh"?"fill":""}" data-mode="zh">Vegyes ZH (30)</button><button class="btn ${Q.mode==="ra"?"fill":""}" data-mode="ra">Csak relációanalízis (15)</button></div>
  <p style="color:var(--ink-2);margin:0">${Q.mode==="ra"?"15 relációanalízis-feladat a teljes anyagból.":"22 feleletválasztós és 8 relációanalízis-feladat, mint a november 7-i teszten."} Minden válasz után megmutatja a helyeset és a cikket, ahol utánanézhetsz.</p>
  <details class="howto"><summary>Hogyan oldj meg egy relációanalízist?</summary><ol><li>Döntsd el külön, igaz-e az állítás.</li><li>Döntsd el külön, igaz-e az indoklás – önmagában, az állítástól függetlenül.</li><li>Csak ha mindkettő igaz: magyarázza-e az indoklás az állítást? Próbáld így: „azért …, mert …” – ha értelmes ok-okozat, A; ha csak két igaz mondat egymás mellett, B.</li></ol><p>A: igaz–igaz, van kapcsolat. B: igaz–igaz, nincs kapcsolat. C: igaz–hamis. D: hamis–igaz. E: hamis–hamis.</p></details>
  <div class="qbar" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <div class="qcard"><div class="meta" style="margin-bottom:8px"><span>${Q.pos+1}. kérdés a ${Q.items.length}-ből</span><span>${ROVAT[byId[it.c].rovat].nev}</span></div>
  ${it.t==="ra" ? `<h2 class="ra"><span class="ra-l">Állítás</span>${esc(it.s1)}<span class="ra-mert">MERT</span><span class="ra-l">Indoklás</span>${esc(it.s2)}</h2>` : `<h2>${esc(it.q)}</h2>`}
  ${opts.map((o,j)=>{let cls="";if(ans!==undefined){if(j===it.a)cls="right";else if(j===ans)cls="wrong"}return `<button class="opt ${cls}" data-j="${j}" ${ans!==undefined?'disabled':''}>${esc(o)}</button>`}).join("")}
  ${ans!==undefined?`<p class="expl"><strong>${ans===it.a?'Helyes.':'Nem ez.'}</strong>${it.t==="ra"&&ans!==it.a?` A helyes válasz: ${"ABCDE"[it.a]}.`:''} ${esc(it.e)} <a href="#c${it.c}">Elolvasom a cikket (${it.c}. lecke)</a></p>`:''}
  <div class="qnav"><span>${Q.answers.filter((x,k)=>x===Q.items[k].a).length} pont eddig</span>${ans!==undefined?`<button class="btn fill" id="qnext">${Q.pos+1<Q.items.length?'Következő':'Eredmény'}</button>`:''}</div></div></div>`;
}
function quizResult(){
  const ok=Q.items.filter((it,k)=>Q.answers[k]===it.a).length, n=Q.items.length, p=Math.round(ok/n*100);
  const verdict = p>=85?"Ez ötös szint – megajánlott jegyre is elég.":p>=70?"Átmentél a 70%-on: írhatnál a megajánlott jegyért.":"Még nincs meg a 70%. Olvasd el a lenti cikkeket, és próbáld újra.";
  const miss=[...new Set(Q.items.filter((it,k)=>Q.answers[k]!==it.a).map(it=>it.c))].sort((a,b)=>a-b);
  const bk="sark-best-"+Q.mode, best=store.get(bk,0); if(ok>best) store.set(bk,ok);
  return `<div class="quiz"><span class="tag" style="--c:var(--ink)">ZH-próba</span><h1>Eredmény</h1>
   <div class="score">${ok}/${n}</div><p style="font-family:var(--display);font-size:20px;margin:4px 0 16px">${p}% – ${verdict}</p>
   <p class="meta">Legjobb eredményed: ${Math.max(ok,best)}/${n}</p>
   ${miss.length?`<h2 style="font-family:var(--display);font-size:22px;margin-top:28px">Ezeket olvasd újra</h2><ul class="misses">${miss.map(id=>`<li><a href="#c${id}">${esc(byId[id].title)}</a></li>`).join("")}</ul>`:''}
   <button class="btn fill" id="qagain" style="margin-top:16px">Új kör</button></div>`;
}

/* router */
const app=document.getElementById("app");
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  let html, r="";
  if(/^c\d+$/.test(h)){ html=article(+h.slice(1)); }
  else if(h==="kviz"){ html=quiz(); r="kviz"; }
  else if(ROVAT[h]){ html=section(h); r=h; }
  else html=home();
  app.innerHTML=html; renderChrome(r);
  bind(h);
}
function bind(h){
  const mr=document.getElementById("markread");
  if(mr){const id=+h.slice(1);mr.onclick=()=>{read.has(id)?read.delete(id):read.add(id);saveRead();route();}}
  const q=document.getElementById("q");
  if(q){q.oninput=()=>{const s=q.value.trim().toLowerCase();const out=document.getElementById("results");
    if(s.length<2){out.innerHTML="";return}
    const hits=ART.filter(a=>(a.title+" "+a.lead+" "+a.body+" "+a.tldr.join(" ")).toLowerCase().includes(s));
    out.innerHTML=`<section class="sec" style="padding-top:12px"><div class="grid">${hits.length?hits.map(a=>card(a,false)).join(""):'<p class="empty">Nincs találat. Próbálj egy kulcsszót a leckéből, például „honosítás”.</p>'}</div></section>`;}}
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{Q.answers[Q.pos]=+b.dataset.j;app.innerHTML=quiz();bind(h)});
  const nx=document.getElementById("qnext"); if(nx) nx.onclick=()=>{Q.pos++;app.innerHTML=quiz();bind(h);window.scrollTo(0,0)};
  const ag=document.getElementById("qagain"); if(ag) ag.onclick=()=>{newQuiz(Q.mode);app.innerHTML=quiz();bind(h)};
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{newQuiz(b.dataset.mode);app.innerHTML=quiz();bind(h)});
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});

/* theme */
const themeBtn=document.getElementById("theme");
const savedTheme=store.get("sark-theme",null); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
themeBtn.onclick=()=>{const dark=document.documentElement.dataset.theme? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t=dark?"light":"dark";document.documentElement.dataset.theme=t;store.set("sark-theme",t);};

renderTicker(); route();
</script>
</body>
</html>
