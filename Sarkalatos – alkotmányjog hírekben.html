<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarkalatos – alkotmányjog hírekben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F4; --surface:#FFFFFF; --ink:#16233B; --ink-2:#4A5568; --line:#DADDD5;
  --mark:#FFE45C; --mark-ink:#16233B;
  --alapok:#2F5BEA; --alkotmanyossag:#0E8A5F; --tortenelem:#8E44AD; --allam:#D0342C; --jogforras:#B7860B;
  --ok:#0E8A5F; --bad:#D0342C;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --text:"Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151F; --surface:#171E2B; --ink:#E9ECF2; --ink-2:#A6AEBD; --line:#2A3344;
    --mark:#E8CE3F; --mark-ink:#10151F;
    --alapok:#7D9BFF; --alkotmanyossag:#3CC796; --tortenelem:#C48BE0; --allam:#FF7468; --jogforras:#E5B83A;
    --ok:#3CC796; --bad:#FF7468; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151F; --surface:#171E2B; --ink:#E9ECF2; --ink-2:#A6AEBD; --line:#2A3344;
  --mark:#E8CE3F; --mark-ink:#10151F;
  --alapok:#7D9BFF; --alkotmanyossag:#3CC796; --tortenelem:#C48BE0; --allam:#FF7468; --jogforras:#E5B83A;
  --ok:#3CC796; --bad:#FF7468; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
:focus-visible{outline:3px solid var(--alapok);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit}

/* masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 20px}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:baseline;gap:0}
.logo b{display:inline-block;background:var(--mark);color:var(--mark-ink);padding:0 4px;margin-right:1px;border-radius:3px;transform:rotate(-3deg)}
.nav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--display);font-weight:600;font-size:15px;text-decoration:none;padding:6px 10px;border-radius:999px;white-space:nowrap}
.nav a:hover,.nav a[aria-current="page"]{background:var(--paper)}
.nav a .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tools{display:flex;gap:8px;align-items:center}
.prog{font-family:var(--display);font-size:14px;color:var(--ink-2);white-space:nowrap}
.btn{font-family:var(--display);font-weight:600;font-size:15px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.fill{background:var(--ink);color:var(--surface)}
.iconbtn{border:none;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.iconbtn:hover{background:var(--paper)}

/* ticker: the one orchestrated motion */
.ticker{background:var(--mark);color:var(--mark-ink);font-family:var(--display);font-weight:600;font-size:15px;overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line)}
.ticker-in{display:inline-flex;gap:48px;padding:8px 0;animation:tick 70s linear infinite}
.ticker:hover .ticker-in{animation-play-state:paused}
.ticker span strong{font-weight:800;margin-right:6px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.ticker-in{animation:none;flex-wrap:wrap;white-space:normal;padding:8px 20px;gap:8px 32px}}

main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}

/* home */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;padding-bottom:32px;border-bottom:1px solid var(--line)}
.lead-story a{text-decoration:none;display:block}
.tag{font-family:var(--display);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tag::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.lead-story h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.4vw,56px);line-height:1.02;letter-spacing:-.025em;margin:10px 0 14px}
.lead-story a:hover h1{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.lead-story p{font-size:20px;color:var(--ink-2);margin:0 0 12px;max-width:62ch}
.meta{font-family:var(--display);font-size:14px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.done{color:var(--ok);font-weight:600}
.side h2,.sec-h h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 12px;letter-spacing:-.01em}
.side ol{list-style:none;margin:0;padding:0;counter-reset:n}
.side li{counter-increment:n;display:grid;grid-template-columns:36px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.side li::before{content:counter(n);font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--ink-2)}
.side li a{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25;text-decoration:none}
.side li a:hover{text-decoration:underline}
.side li small{display:block;font-family:var(--display);font-size:13px;color:var(--ink-2);margin-top:4px}
.zh{margin-top:20px;background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:16px}
.zh h3{font-family:var(--display);font-size:18px;margin:0 0 6px}
.zh p{font-size:16px;margin:0 0 12px}

.sec{padding:36px 0 8px;border-bottom:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:30px;display:flex;align-items:center;gap:10px;margin:0}
.sec-h h2::before{content:"";width:16px;height:16px;border-radius:3px;background:var(--c)}
.sec-h a{font-family:var(--display);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 28px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:4px solid var(--c)}
.card h3{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.18;letter-spacing:-.01em;margin:0}
.card p{font-size:16px;color:var(--ink-2);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3{text-decoration:underline;text-underline-offset:4px}
.card.big{grid-column:span 2}
.card.big h3{font-size:30px;font-weight:800;line-height:1.08}
.card.big p{font-size:18px}
.search{display:flex;gap:8px;margin:0 0 8px}
.search input{flex:1;font:inherit;font-size:17px;padding:10px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.empty{color:var(--ink-2);font-style:italic}

/* article */
.art{display:grid;grid-template-columns:minmax(0,720px) 300px;gap:56px;justify-content:center}
.art header h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.6vw,52px);line-height:1.04;letter-spacing:-.025em;margin:10px 0 16px}
.art .lead{font-size:22px;line-height:1.45;font-weight:600;margin:0 0 16px}
.short{background:var(--surface);border-left:6px solid var(--c);padding:16px 20px;margin:24px 0;border-radius:0 8px 8px 0}
.short h2{font-family:var(--display);font-size:17px;margin:0 0 8px}
.short ul{margin:0;padding-left:20px;font-size:17px}
.body h3{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.01em;margin:36px 0 8px}
.body p,.body li{max-width:68ch}
.body table{width:100%;border-collapse:collapse;font-size:16px;margin:16px 0;display:block;overflow-x:auto}
.body th,.body td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.body th{font-family:var(--display);font-weight:600;background:var(--surface)}
.body td.igen{color:var(--bad);font-weight:600}.body td.nem{color:var(--ok);font-weight:600}
.body .kiemel{background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;padding:12px 16px}
.body ol.lanc{list-style:none;padding:0;counter-reset:s;margin:16px 0}
.body ol.lanc li{counter-increment:s;position:relative;padding:8px 0 8px 48px;border-left:2px solid var(--c);margin-left:16px}
.body ol.lanc li::before{content:counter(s);position:absolute;left:-17px;top:6px;width:32px;height:32px;border-radius:50%;background:var(--c);color:var(--surface);font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:15px}
.body ol.piramis{list-style:none;padding:0;margin:20px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.body ol.piramis li{font-family:var(--display);font-weight:600;font-size:15px;text-align:center;background:var(--surface);border:1.5px solid var(--c);border-radius:4px;padding:6px 10px}
.body ol.piramis li:nth-child(1){width:42%;background:var(--c);color:var(--surface)}
.body ol.piramis li:nth-child(2){width:52%}.body ol.piramis li:nth-child(3){width:62%}.body ol.piramis li:nth-child(4){width:72%}.body ol.piramis li:nth-child(5){width:82%}.body ol.piramis li:nth-child(6){width:90%}.body ol.piramis li:nth-child(7){width:100%}
.pull{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:36px 0;padding:0;border:none}
.pull::before{content:"„";display:block;font-size:72px;line-height:.6;color:var(--c)}
.exam{margin:36px 0;padding:20px;background:var(--mark);color:var(--mark-ink);border-radius:10px}
.exam h2{font-family:var(--display);font-size:20px;margin:0 0 8px}
.exam ul{margin:0;padding-left:20px}
.artfoot{display:flex;justify-content:space-between;gap:16px;margin-top:32px;flex-wrap:wrap}
.artfoot a{font-family:var(--display);font-weight:600;text-decoration:none;max-width:48%}
.artfoot small{display:block;color:var(--ink-2);font-weight:400}
.mark-read{margin:24px 0}
aside.rail{position:sticky;top:96px;align-self:start}
aside.rail h2{font-family:var(--display);font-size:18px;margin:0 0 8px}
aside.rail a{display:block;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25;text-decoration:none;padding:10px 0;border-top:1px solid var(--line)}
aside.rail a:hover{text-decoration:underline}
aside.rail a small{display:block;font-weight:400;color:var(--ink-2);font-size:13px;margin-top:2px}

/* quiz */
.quiz{max-width:720px;margin:0 auto}
.quiz h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.4vw,48px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 12px}
.qbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:16px 0}
.qbar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.qcard h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.25;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;font-size:17px;padding:12px 16px;margin:8px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt[disabled]{cursor:default}
.expl{margin-top:12px;font-size:16px}
.expl a{font-family:var(--display);font-weight:600}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-family:var(--display)}
.score{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;letter-spacing:-.03em}
.misses{padding-left:20px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.howto{margin:12px 0 0;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.howto summary{font-family:var(--display);font-weight:600;cursor:pointer}
.howto ol{margin:8px 0;padding-left:20px}.howto p{margin:0}
.qcard h2.ra{font-size:20px;line-height:1.4;font-weight:400;font-family:var(--text)}
.ra-l{display:block;font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink-2);margin-top:4px}
.ra-mert{display:inline-block;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;background:var(--mark);color:var(--mark-ink);padding:2px 8px;border-radius:4px;margin:10px 0 2px}

footer{max-width:1180px;margin:0 auto;padding:24px 20px 48px;font-family:var(--display);font-size:14px;color:var(--ink-2);border-top:1px solid var(--line)}

@media (max-width:960px){
  .hero{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .art{grid-template-columns:1fr}
  aside.rail{position:static}
  .prog{display:none}
}
@media (max-width:620px){
  body{font-size:17px}
  .top-in{flex-wrap:wrap;gap:8px 12px;padding:10px 16px}
  .nav{order:3;flex-basis:100%}
  .tools{margin-left:auto}
  .grid{grid-template-columns:1fr}
  .card.big{grid-column:auto}
  .card.big h3{font-size:25px}
  main{padding:16px 16px 64px}
  .pull{font-size:24px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#" aria-label="Sarkalatos – címlap"><b>S</b>arkalatos</a>
    <nav class="nav" id="nav" aria-label="Rovatok"></nav>
    <div class="tools">
      <span class="prog" id="prog"></span>
      <a class="btn fill" href="#kviz">ZH-teszt</a>
      <button class="iconbtn" id="theme" aria-label="Világos vagy sötét téma"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 2a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="ticker" aria-label="Gyorshírek"><div class="ticker-in" id="ticker"></div></div>
</header>
<main id="app"></main>
<footer>Sarkalatos – Alkotmányjog I. tanulóanyag hírportál formában, a saját jegyzeteid és az előadások alapján (Dr. Kurunczi Gábor, 2026 ősz). Nem hivatalos kiadvány; vizsga előtt a hatályos Alaptörvényt ellenőrizd.</footer>
<script>
const A1 = [
{id:1, rovat:"alapok", lecke:1, min:4,
 title:"Az önkormányzat eladja a házát – és hirtelen semmivel sem erősebb a vevőnél",
 lead:"Nem az számít, hogy ki ül a jogviszony két oldalán, hanem hogy milyen minőségében. Hat szempont, amellyel bármikor szétválasztod a közjogot a magánjogtól.",
 quote:"Az elhatárolás kulcsa nem az, hogy ki a jogviszony alanya, hanem az, hogy milyen minőségében lép fel.",
 body:`<p>Kézenfekvőnek tűnik a szabály: ahol az állam megjelenik, ott közjog van, ahol magánszemélyek, ott magánjog. <strong>Ez téves.</strong> Az önkormányzatnak van egy ingatlana, amit nem tud hasznosítani, ezért eladja. A vevő bárki lehet, és ebben az adásvételben az önkormányzatnak nincs <em>imperiuma</em>: nem írhatja elő egyoldalúan a vételárat, nem erősebb a vevőnél. Az állam itt <strong>elveszíti közhatalmi jellegét</strong>, mellérendelt szereplő lesz.</p>
<h3>A hat szempont</h3>
<p><strong>1. A felek viszonya.</strong> Magánjogban mellérendeltség, közjogban alá-fölé rendeltség – és a közjogi jogviszony szükségképpeni szereplője az állam, mindig fölérendeltként.</p>
<p><strong>2. Többletjogosítványok.</strong> Az állam egyoldalúan határozza meg a tartalmat. Nem tárgyalhatsz arról, mennyi adót fizetsz, vagy milyen feltételekkel kapsz építési engedélyt.</p>
<p><strong>3. A szabály jellege.</strong> Közjogban főszabály a <strong>kógencia</strong> (eltérést nem enged), magánjogban a <strong>diszpozitivitás</strong>. Vigyázz: ez főszabály, nem kizárólagosság – aki azt mondja, a közjogban „soha” nincs diszpozitív szabály, túlfogalmaz.</p>
<p><strong>4. Keletkezés.</strong> A magánjogi jogviszony a felek akaratából jön létre, a közjogi a felek akaratán kívül. És ha azt mondod, hogy „de hát az építési engedélyt én kérem”? Az ellenvetés összekeveri a megindítást a tartalommal: azért kéred, mert kötelességed – ha nem teszed, bírság vagy bontás jön.</p>
<p><strong>5. Érdekviszony.</strong> Itt téved a legtöbb megérzés. A <strong>magánjogban érdekellentét</strong> van (te drágán adnád az autót, a vevő olcsón venné), az érdekazonosság csak a folyamat eredménye. A <strong>közjogban érdekazonosság</strong> van: a társadalmi szerződés szerint azért hoztuk létre az államot, hogy ellássa a feladatainkat – ehhez pénz kell, tehát nekünk is érdekünk, hogy működjön.</p>
<p><strong>6. Jogsértés esetén.</strong> Magánjogban bírósághoz kell fordulni – ha a vevő nem fizet, nem szedheted be erőszakkal. Közjogban az állam közvetlenül kikényszerít: letiltja a bért, végrehajtót küld.</p>
<h3>A jogágak térképe</h3>
<p>Közjog: alkotmányjog, közigazgatási jog, pénzügyi jog. Magánjog: polgári jog, kereskedelmi jog. A munkajog vegyes. Az alkotmányjog a <strong>statikus felépítés</strong> (milyen az állam), a közigazgatási jog a <strong>tényleges működés</strong>. A büntetőjog egyikbe sem tartozik: az <em>ultima ratio</em>, a jogrendszer záróköve.</p>`,
 tldr:["Nem a szereplő, hanem a minősége dönt","Hat szempont: viszony, többletjog, kógencia, keletkezés, érdek, kikényszerítés","Közjogban érdekazonosság, magánjogban érdekellentét","A büntetőjog az ultima ratio, egyik ágba sem tartozik"],
 vizsga:["Sorold fel a hat elhatárolási szempontot!","Miért nem közjogi az önkormányzati ingatlan eladása?","Miért érdekazonosság van az adózásban?"]},

{id:2, rovat:"alapok", lecke:2, min:3,
 title:"Egyetlen mondat az Alaptörvényben, egy egész jogterület mögötte",
 lead:"Az alkotmány és az alkotmányjog nem ugyanaz. A különbség a gyülekezési jog példáján látszik a legjobban – és a vizsgán pontosan így kell elmondani.",
 quote:"Az Alaptörvény egyetlen mondatához egy egész törvény, kiterjedt alkotmánybírósági és strasbourgi gyakorlat kapcsolódik.",
 body:`<p>Az <strong>alkotmány</strong> egy ország legfontosabb alapdokumentuma: meghatározza az állam felépítését, működésének legfontosabb elveit, az alapvető jogokat és kötelezettségeket. Jellemzője, hogy <strong>generálklauzulás</strong> – csak a legalapvetőbb kérdésekre szorítkozik.</p>
<p>Az <strong>alkotmányjog</strong> ennél sokkal tágabb: minden norma, gyakorlat és értelmezés, ami az alkotmány rendelkezéseit kibontja. Beletartoznak a törvények, a rendeletek, az alkotmánybírósági gyakorlat, a rendes bírói gyakorlat, a nemzetközi bíróságok döntései és a nemzetközi szervezetek iránymutatásai.</p>
<h3>A példa, amivel átmész</h3>
<p>Az Alaptörvény VIII. cikk (1) bekezdése egyetlen mondat: mindenkinek joga van a békés gyülekezéshez. Ez az <em>alkotmány</em>.</p>
<p>Az <em>alkotmányjog</em> ugyanebben a kérdésben:</p>
<ul><li>a <strong>gyülekezési törvény</strong>: szervező, vezető, résztvevő fogalma és felelőssége, bejelentés a rendőrségnek, oszlatás, spontán rendezvény, gyorsgyűlés, konkuráló gyűlés;</li>
<li>az <strong>alkotmánybírósági gyakorlat</strong>: ebből az egy mondatból vezette le az AB a konkuráló gyűlések rendezését, a spontán és bejelentett gyűlés elhatárolását, a rendőrség mozgásterét, a megengedhető tiltási okokat;</li>
<li>a <strong>strasbourgi bíróság</strong> gyakorlata és a nemzetközi iránymutatások.</li></ul>
<p>A tanulság: a két definíció felmondása kevés. Egy konkrét alapjogon kell megmutatni, hogy egy mondatból egy teljes jogterület lesz.</p>`,
 tldr:["Alkotmány: alapdokumentum, generálklauzulás","Alkotmányjog: minden, ami kibontja – törvény, AB, bíróság, Strasbourg","Mindig példával: gyülekezési jog"],
 vizsga:["Mi a különbség az alkotmány és az alkotmányjog között? Mutasd be példán!"]},

{id:3, rovat:"alapok", lecke:3, min:5,
 title:"A Magna Charta ma sem halott – csak a ház alapjába van betonozva",
 lead:"Történeti vagy kartális? Merev vagy rugalmas? Az alkotmányok típusai, és miért a dán eljárás a legkockázatosabb módosítás a világon.",
 quote:"Mindaz, ami korábban volt, nem a múlt, hanem az alap.",
 body:`<p>A <strong>történeti alkotmányt</strong> gyakran íratlannak hívják, de ez félrevezető: az elemei le vannak írva, csak <strong>nincsenek egyetlen dokumentumba foglalva</strong>. Organikusan épül, és a gondolata az, hogy ami korábban volt, az nem a múlt, hanem az alap.</p>
<p><strong>A ház-hasonlat:</strong> a kész házon nem látod az alapot, de ha nem lenne ott, az épület összedőlne. Az angol alkotmány legrégebbi eleme az 1215-ös <strong>Magna Charta</strong>; ma nem alkalmazzák, mégis ugyanúgy része a történeti alkotmánynak, mint a Habeas Corpus vagy a parlamenti szuverenitás. Ez utóbbi miatt nincs Angliában alkotmánybíróság: a parlament döntését semmi nem bírálhatja felül.</p>
<p>A régi elemek <strong>továbbélnek</strong>: az 1222-es Aranybulla nemesi ellenállási joga ma a <strong>petíciós jogban</strong> él tovább.</p>
<p>A <strong>kartális alkotmány</strong> egyetlen dokumentum, mindig a hatályos állapota számít, a módosított rész jogtörténet lesz. Itt van <strong>alkotmányozói pillanat</strong> (forradalom, rendszerváltás, nagy politikai fordulat) – a történeti alkotmánynál nincs, ezért ott valójában alkotmányozás sincs, csak építkezés. Magyarország 1949-ig történeti, azóta kartális alkotmánnyal él.</p>
<h3>Merev vagy rugalmas?</h3>
<p><strong>Formai értelemben</strong> az a kérdés, van-e megváltoztathatatlan rész – <strong>örökkévalósági klauzula</strong>. A német alaptörvény szerint Németország szövetségi köztársaság, és ezt alkotmánymódosítással nem lehet megváltoztatni.</p>
<p><strong>Tartalmi értelemben</strong> az, mennyire könnyű módosítani. Magyarországon az összes képviselő kétharmada kell – papíron merev, a gyakorlatban a választási eredménytől függ: <strong>a rugalmasságot végső soron a választási rendszer határozza meg</strong>. Ausztriában elég az abszolút többség, de utána egy ideig nem lehet újra hozzányúlni. A <strong>dán–svéd modell</strong> a legnehezebb: kétharmad → a parlament feloszlatja magát → az új parlament változatlanul, kétharmaddal újra elfogadja → népszavazás. A parlament a saját mandátumát teszi kockára.</p>
<p><strong>Tartalom szerint</strong> van politikai, pénzügyi-gazdasági és szociális alkotmány – utóbbira a weimari és az 1917-es mexikói alkotmány a példa (ez a világ első szociális alkotmánya).</p>`,
 tldr:["Történeti: nincs egy dokumentumban, a régi az alap","Kartális: egy dokumentum, van alkotmányozói pillanat","Formai merevség = örökkévalósági klauzula","Tartalmi merevség: a választási rendszer is dönt"],
 vizsga:["Miért félrevezető az „íratlan” jelző?","Mi a továbbélés? Példa?","Mutasd be a dán–svéd módosítási modellt!"]},

{id:4, rovat:"alapok", lecke:4, min:3,
 title:"Igen vagy nem egy egész alkotmányra? Ezért ritkán jó ötlet a népszavazás",
 lead:"Az alkotmányozásnál nem a kétharmad a fő kérdés, hanem az, elfogadja-e a társadalom. Chile és Izland megpróbálta a legszélesebb bevonást – és mindkettő elbukott.",
 quote:"A kérdés nem az, hogy ki alkotmányoz, hanem hogy hányan és milyen eljárásban.",
 body:`<p>Egy alkotmány akkor tölti be a szerepét, ha nem egyetlen politikai közösség dokumentumaként tekintenek rá. Ezért az alkotmányozás kulcskérdése a <strong>legitimáció</strong>, nem a szükséges többség megléte.</p>
<p>Az Alaptörvénnyel szemben a fő kritika, hogy egy oldal egyedül szövegezte és fogadta el, ezért „nem mindenki alkotmánya”. A jegyzet rámutat: a kritika visszafelé is működik – ha később a másik oldal alkotmányozna egyedül, ugyanez a hiány terhelné. A valódi kérdés az, <strong>hányan és milyen eljárásban</strong> alkotmányoznak.</p>
<h3>A népszavazás csapdái</h3>
<p><strong>Igen–nem csapda:</strong> egy szöveg 70%-ával egyetérthetsz, 30%-ával nem – egyetlen igen vagy nem ezt nem képezi le, és egy teljes alkotmányt még jogász is nehezen lát át. <strong>Részvételi kockázat:</strong> magas részvétel és nagy többség valóban erős legitimáció; gyenge eredmény viszont <strong>többet árt, mint használ</strong>.</p>
<h3>Deliberatív alkotmányozás</h3>
<p>A társadalmat széles véleményezéssel vonja be, és a véleményeket intézményes csatornákon építi be. A nagy kísérletek – <strong>Chile és Izland</strong> – kudarccal végződtek: gyakorlatilag lehetetlen mindenki véleményét érdemben figyelembe venni, és nagyon hosszú időt igényel, ami egy cikluson belül aligha fér bele.</p>
<h3>A magyar kísérletek</h3>
<p>A rendszerváltás alkotmánya magát ideiglenesnek nevezte. Két alkotmányozói pillanat jött: <strong>1994–1998</strong> (MSZP–SZDSZ kétharmad; a folyamat egy cikluson belül nem zárult le) és <strong>2010</strong> (kétharmados győzelem, ennek eredménye az Alaptörvény).</p>`,
 tldr:["Kulcs: legitimáció, nem csak többség","Népszavazás: igen–nem csapda és részvételi kockázat","Deliberatív: Chile, Izland – kudarc","Magyar pillanatok: 1994–98 (sikertelen), 2010"],
 vizsga:["Miért problémás az alkotmány népszavazásos megerősítése?","Mi a deliberatív alkotmányozás, és miért bukott el eddig?"]},

{id:5, rovat:"alapok", lecke:5, min:5,
 title:"Ugyanaz a szöveg, két ellentétes ítélet: miért az amerikai alkotmány a legrugalmasabb",
 lead:"Négy út, négyféle viszony a múlthoz. Az angol épít, az amerikai értelmez, a francia tiszta lapot kezd, a közép-európai alkut köt.",
 quote:"Tetszettek volna forradalmat csinálni.",
 body:`<p>A tipizálás alapja: hogyan viszonyul egy jogrendszer <strong>a saját múltjához</strong> egy alkotmányos fordulatkor.</p>
<h3>Angol – organikus</h3><p>Nincs alkotmányozás, csak folyamatos építkezés; a régi elemek alapként maradnak; a parlamenti szuverenitás miatt nincs alkotmánybíráskodás.</p>
<h3>Amerikai – a szöveg érinthetetlen</h3>
<p>A 18. század végi alkotmányt azóta sem módosították, csak <strong>kiegészítették</strong> (amendment). Itt érvényesül a klasszikus montesquieu-i hatalommegosztás, a <em>checks and balances</em>.</p>
<p>Miért a <strong>legrugalmasabb</strong>, ha a szöveg szinte megváltoztathatatlan? Mert a rugalmasságot az <strong>értelmezés</strong> adja. A Supreme Court a 70-es években (<strong>Roe kontra Wade</strong>) az abortuszt lényegében az anya önrendelkezésére bízta – néhány éve, részben megváltozott összetétel mellett, <em>ugyanabból a szövegből</em> ellentétes tartalmat vezetett le, lehetővé téve a szigorú tagállami szabályozást.</p>
<h3>Francia – forradalmi</h3>
<p>Minden új hatalom <em>tabula rasát</em> nyom, mintha korábban nem lett volna alkotmányos berendezkedés: nincs örökkévalósági klauzula, nincs kötődés a régihez. Az alkotmányok sora egészen az <strong>1958-as, de Gaulle-féle</strong> alkotmányig tartott – az ötödik köztársaság félprezidenciális rendszere azóta stabil.</p>
<h3>Német és közép-európai – kompromisszumos</h3>
<p>Nem elvetik a régit, hanem építenek rá. A weimari rendszerről Hitler bebizonyította, hogy alkalmas a diktatórikus fordulatra. A háború után a nyugati részen <strong>ideiglenesnek</strong> szánt <strong>bonni alaptörvény</strong> született (alkotmánya csak egységes országnak lehet) – az egyesüléskor pedig nem alkottak újat, hanem kiterjesztették a hatályát keletre, a név maradt.</p>
<p>A térség rendszerváltásai Románia kivételével békésen zajlottak. Antall József mondata – <em>„tetszettek volna forradalmat csinálni”</em> – erre utal: a békés átmenet ára az elmaradt felelősségre vonás volt, cserébe a régi hatalom átadta a pozícióit, és még a pártállami parlament fogadta el az átmenet alkotmányát.</p>`,
 tldr:["Angol: a múlt az alap","Amerikai: szöveg marad, értelmezés változik (Roe v. Wade)","Francia: tabula rasa, 1958 – V. köztársaság","Német/közép-európai: kompromisszum, bonni alaptörvény, 1989"],
 vizsga:["Miért a világ legrugalmasabb alkotmánya az amerikai?","Mi a tabula rasa alkotmányozás?","Mi volt a közép-európai kompromisszum ára?"]},

{id:6, rovat:"alkotmanyossag", lecke:6, min:4,
 title:"Miért igazoltathat a rendőr? A vizsgán végig kell tudnod mondani a láncot",
 lead:"Észak-Koreának is van alkotmánya. Attól alkotmányos egy állam, hogy öt alapelv a gyakorlatban is működik – az első a demokrácia, és a legitimációs láncolat.",
 quote:"A lényeg a lánc megszakítatlansága.",
 body:`<p>Ha az alkotmányosságot az alkotmány létén mérnénk, Észak-Korea is alkotmányos állam lenne. Az <strong>alkotmányosság</strong> az alapelvek <strong>tényleges érvényesülését</strong> jelenti. Öt ilyen elv van: <strong>demokrácia, pluralizmus, jogállamiság, hatalommegosztás, az alapjogok tényleges érvényesülése</strong>.</p>
<h3>Istentől a népig</h3>
<p>A demokrácia a görög <em>démosz</em> szóból ered: népuralom. Alapja a <strong>népszuverenitás</strong>. A szuverén fogalmát <strong>Jean Bodin</strong> dolgozta ki – de nála a király hatalma még Istentől ered (ennek lenyomata a koronázáskori olajjal felkenés). <strong>Locke, Hobbes és Rousseau</strong> fordította meg: a hatalom a <strong>néptől</strong> ered – ez a társadalmi szerződés, és ez jelenik meg a francia Emberi és Polgári Jogok Nyilatkozatában és az amerikai függetlenségi nyilatkozatban.</p>
<p>Egy állam akkor demokratikus, ha döntéshozó szerveinek felhatalmazása <strong>a népre vezethető vissza</strong>. A <strong>demokratikus legitimáció</strong>: minden hatalmat gyakorló szerv csak akkor legitim, ha hatalma <strong>megszakítatlan láncolaton</strong> át visszavezethető a népre.</p>
<h3>A lánc, lépésről lépésre</h3>
<ol class="lanc"><li>A <strong>nép</strong> választja az Országgyűlést.</li><li>Az <strong>Országgyűlés</strong> választja a köztársasági elnököt és a miniszterelnököt.</li><li>A <strong>köztársasági elnök</strong> a miniszterelnök javaslatára kinevezi a belügyminisztert.</li><li>A kormány a <strong>belügyminiszteren</strong> keresztül irányítja az országos rendőrfőkapitányt.</li><li>Tőle ered végső soron az intézkedő <strong>rendőr</strong> felhatalmazása.</li></ol>
<p>Nem elég annyi, hogy „a rendőr az államtól kapja a felhatalmazást” – minden láncszemet el kell mondani.</p>
<p><strong>Ellenpélda:</strong> a kommunista időszakban a valódi hatalmat a Népköztársaság Elnöki Tanácsa gyakorolta, amelyet nem a nép választott. A lánc megszakadt – már ez kizárja a demokráciát.</p>`,
 tldr:["Alkotmányosság = öt elv tényleges érvényesülése","Bodin: Istentől; Locke, Hobbes, Rousseau: a néptől","Legitimáció: megszakítatlan lánc a népig","Rendőr-példa: nép → OGY → KE/ME → BM → ORFK → rendőr"],
 vizsga:["Sorold fel az alkotmányosság öt alapelvét!","Vezesd le a rendőri igazoltatás legitimációját!"]},

{id:7, rovat:"alkotmanyossag", lecke:7, min:3,
 title:"Lapos Föld? Szabad. Oltásmegtagadás? Ott már vége a világnézeti szabadságnak",
 lead:"A pluralizmus két dolgot jelent: valódi pártversenyt és gondolatszabadságot. Mindkettőnek van határa – és mindkét határ védi a demokráciát.",
 quote:"A meggyőződés szabad marad, a cselekvés viszont korlátozható.",
 body:`<h3>Politikai pluralizmus</h3>
<p>A pártok szabad megalakulása és működése elengedhetetlen, de nem korlátlan. A magyar <strong>párttörvény</strong> szerint a párt olyan egyesület, amely magára nézve elfogadja a párttörvényt, ezért:</p>
<ul><li><strong>nem fogadhat el külföldi forrást</strong>;</li><li>szigorú elszámolás terheli, az <strong>Állami Számvevőszék</strong> ellenőrzi;</li><li>tevékenysége nem irányulhat <strong>a hatalom kizárólagos megszerzésére</strong>.</li></ul>
<p>Egy párt betiltása önmagában nem sérti a pluralizmust, ha nem felel meg a követelményeknek. A lényeg a <strong>szabad verseny</strong>: a kommunista Magyarországon nem voltak szabad választások.</p>
<p><strong>Látszatverseny:</strong> ha rendszeresen tartanak választást, de előtte kizárják a valódi kihívókat, formálisan van verseny, valójában nincs – a jegyzet szerint a mai orosz gyakorlat erre épül. A demokráciát nem a választások megtartása, hanem a verseny valódisága méri.</p>
<h3>Világnézeti pluralizmus</h3>
<p>Mindenki abban hisz, amiben akar – amíg ezzel másokat vagy önmagát nem veszélyezteti. Aki szerint lapos a Föld, nem árt senkinek. Aki viszont nem oltatja be a gyermekét, rontja a <strong>nyájimmunitást</strong>, és ezzel mások egészségét veszélyezteti – itt belép az állam <strong>életvédelmi kötelezettsége</strong>, végső soron kényszeroltással.</p>
<p>A megkülönböztetés: a lelkiismereti szabadság kiterjed arra, hogy <em>gondolhatod</em> károsnak az oltást, de a <em>döntési szabadságot</em> nem biztosítja. Romániában, ahol a kanyaró elleni oltás nem volt kötelező, járvány tört ki.</p>`,
 tldr:["Politikai: valódi pártverseny; párttörvényi korlátok védik","Látszatverseny ≠ demokrácia","Világnézeti: gondolat szabad, cselekvés korlátozható","Oltás: életvédelmi kötelezettség, nyájimmunitás"],
 vizsga:["Milyen követelmények vonatkoznak a pártokra?","Hol a világnézeti szabadság határa? Példa?"]},

{id:8, rovat:"alkotmanyossag", lecke:8, min:4,
 title:"Egy szóban a jogállam: kiszámíthatóság",
 lead:"Megszűnik a kamattámogatás? Csak az számít, hogy számíthattál-e rá. Öt eset, amelyen begyakorolhatod, mi sérti a jogbiztonságot.",
 quote:"A különbség nem azon múlik, hogy a változtatás kellemetlen-e, hanem azon, hogy számíthatott-e rá.",
 body:`<p>A <em>rule of law</em> szó szerint a <strong>jog uralma</strong>: a hatalomgyakorlás jogszabályok által meghatározott rendben zajlik. Ha egyetlen szóval kellene megragadni: <strong>kiszámíthatóság</strong>.</p>
<h3>A jogbiztonság AB-definíciója</h3>
<p>Az Alkotmánybíróság szerint jogbiztonság akkor van, ha a normák mindenki számára <strong>megismerhetők</strong>, <strong>érthetők</strong>, és mindenkinek <strong>megfelelő idő</strong> jut a felkészülésre és alkalmazkodásra. Köznyelven: tudom, mit kell betartanom, időben megismertem, fel tudtam készülni, és tudom, mi jár, ha megszegem.</p>
<p>Ugyanez eljárásokra vetítve a <strong>tisztességes eljáráshoz való jog</strong>, <strong>hatósági</strong> és <strong>bírósági</strong> ággal.</p>
<h3>Teszteld magad</h3>
<table><thead><tr><th>Eset</th><th>Sérti?</th></tr></thead><tbody>
<tr><td>A futamidő végéig garantált kamattámogatást utólag megszüntetik</td><td class="igen">Igen</td></tr>
<tr><td>Az öt évre garantált kamatot ötévente felülvizsgálják – és felül is vizsgálják</td><td class="nem">Nem</td></tr>
<tr><td>Lakás-előtakarékossági támogatás megszüntetése csak új szerződésekre</td><td class="nem">Nem</td></tr>
<tr><td>Ugyanez a meglévő szerződésekre is</td><td class="igen">Igen</td></tr>
<tr><td>Hivatalban lévő köztársasági elnök eltávolítása alaptörvény-módosítással</td><td class="igen">Igen</td></tr>
</tbody></table>
<p>A mérce: ha a módosítás lehetősége eleve be volt építve a jogviszonyba, a kiszámíthatóság nem sérül; a fennálló jogviszonyba való utólagos beavatkozás viszont sérti.</p>`,
 tldr:["Rule of law = a jog uralma; jogállam = kiszámíthatóság","Jogbiztonság: megismerhető, érthető, van felkészülési idő","Tisztességes eljárás: hatósági és bírósági ág","Mérce: számíthatott-e rá az érintett?"],
 vizsga:["Ismertesd a jogbiztonság AB-definícióját!","Elemezz két esetet a kiszámíthatóság szempontjából!"]},

{id:9, rovat:"alkotmanyossag", lecke:9, min:5,
 title:"98 százalékos különadó: igazságos volt, mégis megsemmisítették",
 lead:"Mi történik, ha a jogbiztonság és az igazságosság ütközik? A jogállamban az egyik mindig nyer – és nem az, amelyik jobban esik.",
 quote:"A jogállamot nem lehet a jogállam ellenében megvalósítani.",
 body:`<p><strong>Sólyom László</strong> alkotmánybírósági elnökként, az igazságtételi törvényt megsemmisítő döntéshez fűzött párhuzamos indokolásában mondta ki: <strong>a jogállamot nem lehet nem jogállami eszközökkel helyreállítani</strong>. Ha a múlt hiányosságait nem jogállami módon orvosoljuk, a végeredmény sem lesz jogállam.</p>
<h3>Amikor a két érték ütközik</h3>
<p><strong>A kényszervallatás dilemmája:</strong> elraboltak egy kislányt, a tettes elismeri, hogy élve elásta, de a helyet nem árulja el. Az igazságérzet bármilyen eszközt megengedne – a jogállam viszont a kínzást a legszélsőségesebb helyzetben sem engedi.</p>
<p><strong>A 98%-os különadó:</strong> 2010 után derült ki, hogy a fővárosi közlekedési vállalatnál egy-két hónapos, érdemi munka nélküli jogviszony után több tízmilliós végkielégítéseket fizettek – a munkajog akkor <strong>ezt lehetővé tette</strong>, tehát jogszerű volt. A törvényhozó egy összeghatár feletti részre 98%-os különadót vetett ki. Az igazságérzetnek megfelelt, a jogbiztonságot sértette – <strong>az AB megsemmisítette</strong>.</p>
<p><strong>Az elévülés:</strong> a kommunista megtorlások egyik vezetőjét nem lehetett felelősségre vonni, mert a cselekmény elévült (az elkövetéskori Btk. az irányadó, szigorúbb szabály nem alkalmazható visszamenőleg). A későbbi törvény visszamenőleg tette el nem évülővé – igazságos, de a jogbiztonság szerint nem lehetséges.</p>
<p class="kiemel"><strong>A szabály:</strong> ütközés esetén a jogbiztonságnak van elsőbbsége.</p>
<h3>A fogalom eróziója</h3>
<p>A jegyzet szerint a jogállamiság mára gumifogalommá vált: az EU-s gyakorlat (különösen az EUSZ 7. cikk szerinti eljárás) a közpénzek átláthatóságától a bírói függetlenségig mindent alá von – így elveszíti az élét. A hasonlat: aki mindig farkast kiált, annak akkor sem hisznek, amikor tényleg jön a farkas.</p>
<h3>A hármas, amit érdemes megjegyezni</h3>
<p><strong>Kormányváltás</strong>: a játékosokat cseréljük. <strong>Rezsimváltás</strong>: a játékszabályokat. <strong>Rendszerváltozás</strong>: magát a játékot. A kétharmad átírhatja a szabályokat – a mérce az, hogy a játék, a demokrácia ne változzon meg.</p>`,
 tldr:["Sólyom-tétel: jogállamot csak jogállami eszközzel","Ütközéskor a jogbiztonság nyer","Példák: kényszervallatás, 98%-os különadó, elévülés","Kormányváltás – rezsimváltás – rendszerváltozás"],
 vizsga:["Mit mond a Sólyom-tétel, és milyen döntéshez kapcsolódik?","Mi történik, ha a jogbiztonság és az igazságosság ütközik? Példával!"]}
];

const A2 = [
{id:10, rovat:"alkotmanyossag", lecke:10, min:4,
 title:"Apa a libikóka egyik végén, anya és gyerek a másikon: így működik a hatalommegosztás Európában",
 lead:"Az amerikai modellben mindenki a saját elefántcsonttornyában ül. Nálunk nem elválasztás van, hanem egyensúlyozás – egy eleve erősebb szereplő mellett.",
 quote:"Ha a magyar berendezkedést a checks and balances logikájával írod le, hibás választ adsz.",
 body:`<h3>Az amerikai modell</h3>
<p>A klasszikus, <strong>montesquieu-i</strong> hatalommegosztás a <em>checks and balances</em>, a <strong>fékek és ellensúlyok</strong> rendszere: a hatalmi ágak teljesen függetlenek, de kontrollálhatják és ellensúlyozhatják egymást. Mindhárom a saját elefántcsonttornyában ül.</p>
<h3>A libikóka</h3>
<p>Ha a mérleghinta egyik végén egy négy-öt éves gyerek ül, a másikon az apja, a gyerek hiába ugrál. Ha az anya is felül a gyerek mellé, ketten már kiegyensúlyozzák. Ez a <strong>modern hatalommegosztás</strong>: nem az ágak elválasztása, hanem az egymás ellensúlyozására képes hatalmi ágak és tényezők <strong>egyensúlya</strong> – akkor is, ha az egyik kiemelkedően erős.</p>
<p>Magyarországon az egyik serpenyőben egy <strong>kiemelkedően erős végrehajtó hatalom</strong> ül. (Ezért értelmetlen alkotmányjogilag a kérdés, hogy „ha egy napig miniszterelnök lennél, melyik törvényt módosítanád” – mégis a kormány a fő törvénykezdeményező, mögötte a parlamenti többség.) A másik serpenyőbe ezért <strong>több szereplő</strong> kell:</p>
<ul><li>a parlament ellenőrző eszközei: <strong>interpelláció, kérdés, bizalmatlansági indítvány</strong>;</li><li>az <strong>ombudsman</strong>, az <strong>ügyészség</strong>, az <strong>Alkotmánybíróság</strong> és a <strong>bíróságok</strong>.</li></ul>
<p>A döntő különbség: nálunk a törvényhozás és a végrehajtás <strong>szorosan összefonódik</strong>. A parlament választja és mozdíthatja el a miniszterelnököt, a kormány pedig meghatározza a parlament munkáját. <strong>A kormány a parlament bizalmából létezik.</strong> Amerikában ez a kapcsolat hiányzik.</p>
<h3>Az ötödik alapelv</h3>
<p>Nem elég az alapjogokat felsorolni – <strong>ténylegesen gyakorolhatónak</strong> kell lenniük. A kommunista alkotmány is tartalmazta a vallásszabadságot, de aki élt vele, elveszíthette az állását vagy az iskolai helyét.</p>`,
 tldr:["Amerikai: független ágak, fékek és ellensúlyok","Európai: libikóka, egyensúlyozás","Magyar: erős végrehajtás ↔ parlamenti eszközök, ombudsman, ügyészség, AB, bíróságok","Alapjog: a gyakorolhatóság a mérce"],
 vizsga:["Fejtsd ki a libikóka-modellt a magyar államszervezetre!","Mi a döntő különbség a magyar és az amerikai modell között?"]},

{id:11, rovat:"tortenelem", lecke:11, min:4,
 title:"Ne a rendszerváltásnál kezdd! 950 év történeti alkotmány dióhéjban",
 lead:"A vizsgázók tipikus hibája, hogy 1989-cel indítanak. Az Aranybullától 1949-ig tartó út vázlatosan is kell – az 1848-at és a kiegyezést pedig részletesen.",
 quote:"Lényegében ez a modell él ma is.",
 body:`<p>A magyar alkotmányosság több mint ezeréves történetéből mintegy <strong>950 év a történeti alkotmányosság</strong> kora. Az előadó külön figyelmeztetett: vizsgán és záróvizsgán is hiba a rendszerváltással kezdeni – az Alaptörvény is utal a történeti alkotmányra.</p>
<h3>Az államalapítástól 1848-ig – elég felsorolni</h3>
<ul><li><strong>Szent István Intelmei</strong> Imre herceghez – már tartalmaz az állami működésre vonatkozó iránymutatást.</li>
<li><strong>1222 – Aranybulla</strong>: a Szent Korona felsőbbrendűsége, a nemesi kiváltságok és az <strong>ellenállási jog</strong> (mai továbbélése: a petíciós jog).</li>
<li><strong>1351</strong>: az ősiség szabályai, az Aranybulla megerősítése.</li>
<li><strong>1514</strong>: Werbőczy Hármaskönyve (Tripartitum).</li>
<li>A Rákóczi-szabadságharc és a Habsburg-ház trónfosztása.</li></ul>
<h3>1848: az áprilisi törvények – ezt részletesen</h3>
<p>Addig a feudalizmus adta a berendezkedés alapját; a polgári társadalmat és demokráciát ezek a törvények alapozták meg:</p>
<ul><li>az <strong>első felelős magyar kormány</strong>, a Batthyány-kormány – és lényegében <strong>ez a modell él ma is</strong>: az Országgyűlésnek felelős testület, onnan kapja a felhatalmazását és onnan mozdítható el;</li><li>az első <strong>választójogi szabályok</strong>;</li><li>az Országgyűlés nem rendi, hanem <strong>népképviseleti</strong> testület.</li></ul>
<p>(Az előadó anekdotája szerint egy záróvizsgázónak nem jutott eszébe, melyik volt az első felelős kormány – ne te legyél a következő.)</p>
<h3>1867: a kiegyezés</h3>
<p>Létrejött az <strong>Osztrák–Magyar Monarchia</strong> közös uralkodóval és <strong>három közös üggyel: külügy, hadügy, pénzügy</strong> (utóbbi az előző kettő finanszírozására). Minden más – kormány, országgyűlés – a két államban függetlenül működött.</p>
<h3>1949-ig</h3>
<ul><li>Rövid tanácsköztársaság; a Horthy-korszak, a „király nélküli királyság”.</li>
<li><strong>1946. évi I. törvény</strong>: az államforma köztársaság. Az 1947-es kékcédulás választások után a leszalámizás vetett véget a rövid időszaknak.</li>
<li><strong>1949. évi XX. törvény</strong>: az <strong>első magyar kartális alkotmány</strong> – szakított a 950 éves hagyománnyal, a szovjet alkotmány szolgai átvétele, az alkotmányossági elveknek egyáltalán nem felelt meg.</li></ul>`,
 tldr:["Kezdd az Aranybullánál, ne 1989-nél","1848: első felelős kormány, választójog, népképviselet","1867: Monarchia, 3 közös ügy","1946. évi I. tv. köztársaság; 1949. évi XX. tv. első kartális alkotmány"],
 vizsga:["Melyek az áprilisi törvények vívmányai?","Mi volt a három közös ügy?","Miért jelentős az 1949. évi XX. törvény?"]},

{id:12, rovat:"tortenelem", lecke:12, min:5,
 title:"Előbb létre kell jönni, aztán lehet kivonulni: így épült fel a rendszerváltás, törvényről törvényre",
 lead:"A rendszerváltozás közjogilag nem egy esemény, hanem okozati lánc 1987-től 1990-ig. Minden lépés a következőt teszi lehetővé.",
 quote:"Előbb létre kell jönni (egyesülés, II.), és csak azután lehet kivonulni az utcára (gyülekezés, III.).",
 body:`<h3>1987: a kezdőlökés</h3>
<p>Az állampárt felismerte, hogy hatalma átmentéséhez engedményeket kell tennie. Az <strong>1987. évi XI. törvény</strong> (jogalkotási törvény) először mondta ki, hogy <strong>a törvények megalkotása az Országgyűlés feladata</strong>. Addig a valóságban a Népköztársaság Elnöki Tanácsa alkotta a legfontosabb szabályokat <strong>törvényerejű rendeletekben</strong> – demokratikus legitimáció nélkül.</p>
<h3>1987–1989: a pártok</h3>
<p>Először illegalitásban jelent meg az FKGP, az MDF, a Fidesz és az SZDSZ; 1989-re megalakult az <strong>Ellenzéki Kerekasztal</strong>.</p>
<h3>1989: a legalitás talaja</h3>
<table><thead><tr><th>Törvény</th><th>Tárgy</th></tr></thead><tbody><tr><td>1989. évi II.</td><td>egyesülési jog – ettől jöhettek létre legálisan a pártok</td></tr><tr><td>1989. évi III.</td><td>gyülekezési jog – ettől lehetett legálisan tüntetni</td></tr></tbody></table>
<p>A sorszámokat össze szokták keverni. A logika segít: előbb létre kell jönni, csak utána lehet kivonulni az utcára.</p>
<h3>A Nemzeti Kerekasztal</h3>
<p>Háromoldalú: az Ellenzéki Kerekasztal, az MSZMP és a civil-vállalkozói oldal (érdemi szerep nélkül). Két nevet érdemes megjegyezni: <strong>Tölgyessy Péter</strong> (SZDSZ) és <strong>Salamon László</strong> (KDNP, később alkotmánybíró).</p>
<h3>A csúcspont: 1989. évi XXXI. törvény</h3>
<p>Az 1949-es alkotmány olyan átfogó módosítása, hogy <strong>egyetlen szakasza sem maradt változatlan</strong>: alapjogi katalógus és az új államszervezet alapja. De: <strong>meghagyta az 1949. évi XX. törvény számozását és nevét</strong>, és preambulumában <strong>ideiglenesnek</strong> nevezte magát – mert még a pártállami parlament fogadta el. Az „ideiglenes” alkotmány végül több mint húsz évig volt hatályban.</p>
<h3>Ami ebből következett</h3>
<ul><li><strong>1989. október 23.</strong>: a köztársaság kikiáltása;</li><li>választójogi törvény → 1990 áprilisában szabad választás, májusban új Országgyűlés;</li><li>az <strong>Alkotmánybíróságról</strong> szóló törvény: őr az átmenet és az alkotmányosság felett.</li></ul>
<p>1990 után az MDF koalícióban kormányzott; a kétharmados törvényekhez ellenzéki szavazat kellett. Így jött létre az <strong>Antall–Tölgyessy-paktum</strong>: a köztársasági elnök SZDSZ-es lehet, cserébe az SZDSZ megszavazza a kétharmados törvényeket.</p>`,
 tldr:["1987. évi XI.: a törvényalkotás az OGY-é","1989. évi II. egyesülés, III. gyülekezés","Nemzeti Kerekasztal: Tölgyessy, Salamon","1989. évi XXXI.: teljes átírás, régi szám, ideiglenes","Antall–Tölgyessy-paktum"],
 vizsga:["Mondd el a rendszerváltás közjogi láncát!","Mi volt az 1989. évi XXXI. törvény két formai sajátossága?"]},

{id:13, rovat:"tortenelem", lecke:13, min:6,
 title:"Az Alaptörvény 90 százaléka a régi alkotmány volt. A vita mégsem a szövegről szólt",
 lead:"Elfogadás, elnevezés, szerkezet, Nemzeti hitvallás és a felülalkotmányozás. A számozást a vizsgán fejből kell tudni.",
 quote:"Az alkotmányos fékek lebontása mindig annak is a mozgásterét szűkíti, aki később kerül hatalomra.",
 body:`<h3>Dátumok</h3>
<p>Elfogadás: <strong>2011. április 18.</strong> Aláírás: április 25. Hatálybalépés: <strong>2012. január 1.</strong> Az ellenzék kezdetben részt vett, végül kivonult, így a kormányoldal egyedül maradt. A jegyzet szerint az eredeti szöveg kb. 90%-ban egyezett a korábbi alkotmánnyal; a kritika főleg az <strong>eljárást</strong> érte.</p>
<h3>Miért „alaptörvény”?</h3>
<p>Három magyarázat: német párhuzam (átmenetiség, mint Bonnban); külön, kiemelt státusz; és a legelfogadottabb: <strong>magalkotmány</strong> – csak a legalapvetőbb szabályokat tartalmazza, a részleteket <strong>sarkalatos törvények</strong> bontják ki.</p>
<h3>A szerkezet – számozással</h3>
<table><thead><tr><th>Rész</th><th>Tartalom</th><th>Számozás</th></tr></thead><tbody>
<tr><td>Nemzeti hitvallás</td><td>értékalapú preambulum</td><td>–</td></tr>
<tr><td>Alapvetés</td><td>jogállamiság, demokrácia, szuverenitás, jelképek</td><td>ABC betűi</td></tr>
<tr><td>Szabadság és felelősség</td><td>alapjogok, kötelezettségek</td><td>római számok</td></tr>
<tr><td>Az állam</td><td>OGY, KE, kormány, bíróságok, AB, ombudsman</td><td>arab számok</td></tr>
<tr><td>Záró rész</td><td>átmeneti és záró rendelkezések</td><td>pontok</td></tr></tbody></table>
<p>Ebből kikövetkeztethető: a B) cikk az Alapvetésben, a XXIV. cikk a Szabadság és felelősségben, a 15. cikk Az államban van.</p>
<h3>Kötelez-e a Nemzeti hitvallás?</h3>
<p><strong>Mellette:</strong> az R) cikk szerint az Alaptörvényt a hitvallással összhangban kell értelmezni. <strong>Ellene (a meggyőzőbb):</strong> a hitvallás érvénytelennek tekinti az 1944. március 19. és 1990. május 2. közötti időszakot – ha ez kötne, érvénytelen lenne minden akkori szerződés, sőt házasság is. Ezért inkább <strong>értékvallomás</strong>.</p>
<p>A semlegességi kifogásra („Isten, áldd meg a magyart”) a jegyzet két ellenérvet hoz: sok alkotmány államvallást is kimond, és a kérdés az, biztosított-e a pluralizmus; illetve <strong>értéksemlegesen nem lehet alkotmányozni</strong>.</p>
<h3>Tizenöt módosítás tizenöt év alatt</h3>
<p>A módosítások gyakran <strong>AB-döntéseket alkotmányoztak felül</strong> (amit az AB alkotmányellenesnek mondott, azt beemelték az Alaptörvénybe), vagy az AB hatásköreit szűkítették.</p>
<p><strong>A kulcsesemény:</strong> az elfogadáskor külön dokumentum született, az <strong>Átmeneti rendelkezések</strong>, ami magát alaptörvényi szintre emelte, és érdemi szabályokkal volt tele. Az AB <strong>2012 decemberében megsemmisítette</strong> (érdemi szabályozás, és megosztottá tenné az alkotmányt). A válasz a <strong>negyedik módosítás</strong> lett: az AB az alkotmánymódosítást <strong>csak eljárási szempontból</strong> vizsgálhatja.</p>
<p>A következmény ma is él: ha egy módosítás nyíltan szembemegy az alkotmányossággal, az AB tartalmilag nem vizsgálhatja. Az előadó által idézett párhuzamos indokolás szerint az alkotmányozó egykori önmérséklet-hiánya tette lehetetlenné a mai felülvizsgálatot – és ez bármelyik későbbi többségre igaz.</p>`,
 tldr:["2011. ápr. 18. elfogadás, 2012. jan. 1. hatály","Magalkotmány + sarkalatos törvények","Hitvallás – ABC – római – arab – pontok","Hitvallás: inkább értékvallomás","Átmeneti rendelkezések megsemmisítése (2012) → 4. módosítás"],
 vizsga:["Ismertesd az Alaptörvény szerkezetét a számozással!","Van-e jogi kötőereje a Nemzeti hitvallásnak?","Mi volt a negyedik alaptörvény-módosítás előzménye és tartalma?"]},

{id:14, rovat:"allam", lecke:14, min:4,
 title:"Terület, nép, főhatalom: Jellinek három feltétele, és miért nem állam Palesztina",
 lead:"Ha bármelyik elem hiányzik, nincs állam. Koszovó pedig megmutatja, hogy néha még a három sem elég.",
 quote:"Egy állam szuverenitását csak és kizárólag saját maga korlátozhatja.",
 body:`<p>Alkotmányos értelemben kétféle szuverenitás van: a <strong>népszuverenitás</strong> (a hatalom a népre vezethető vissza) és az <strong>államszuverenitás</strong> (az állam önálló döntéshozó képessége). A fogalom Bodintől ered; az államszuverenitáshoz <strong>Georg Jellinek</strong> neve tartozik. (Az előadó anekdotája: egy vizsgázó szerint „Jellineknek van egy elmélete” – a bizottság meg azon gondolkodott, ki az a jedi.)</p>
<h3>A jellineki triász</h3>
<p>Állam akkor van, ha együtt megvan:</p>
<ol class="lanc"><li><strong>terület</strong>;</li><li>ezen élő <strong>népesség</strong>, amelyet valami közös összeköt;</li><li><strong>főhatalom</strong>: fölérendelt szervezet, amely a népességgel szemben közvetlenül kikényszeríthető szabályokat alkot.</li></ol>
<p><strong>Hiányzó elem:</strong> Palesztinának van kormányzata és népessége, de nincs olyan területe, amelyen az államiság ténylegesen megvalósulhatna. A kurdoknak (Irak, Törökország, részben Irán) van népességük és szervezett vezetésük, de saját területük nincs.</p>
<h3>Az íratlan negyedik: elismerés</h3>
<p><strong>Koszovó</strong> elvileg rendelkezik területtel és főhatalommal, de alkotmánya egy nemzetközi szerződés melléklete, a rendet békefenntartók biztosítják, elismertsége sok országban vitatott. A triász szükséges, de nem mindig elégséges.</p>
<h3>Szuverenitássértés-e a strasbourgi ítélet?</h3>
<p><strong>Nem.</strong> Ha az állam csatlakozik az Emberi Jogok Európai Egyezményéhez, és a strasbourgi bíróság kártérítésre kötelezi, azt azért teheti, mert <strong>maga az állam tette lehetővé</strong>: aláírta, belépett, önmagát korlátozta. A szuverenitás akkor sérül, ha a korlátozás kívülről, más állam akaratából jön.</p>`,
 tldr:["Nép- és államszuverenitás","Jellinek: terület + népesség + főhatalom","Palesztina, kurdok: hiányzó elem; Koszovó: elismerés","Önkorlátozás: a nemzetközi szerződés nem szuverenitássértés"],
 vizsga:["Ismertesd a jellineki triászt példákkal!","Sérti-e a szuverenitást a strasbourgi bíróság ítélete?"]},

{id:15, rovat:"allam", lecke:15, min:4,
 title:"Nem, a nagykövetség nem az USA területe – és a Kármán-vonal 100 kilométernél húzódik",
 lead:"Folyók, tengerek, légtér, a föld méhe és a repülőgépek. Az államterület szabályai, amelyekben a vizsgán rendszeresen tévednek.",
 quote:"A budapesti amerikai nagykövetség Magyarország területének része.",
 body:`<p>Az államterületet főszabályként <strong>nemzetközi egyezmények</strong> határozzák meg. A legsúlyosabb szuverenitássértés más állam területének megsértése – ezért riasztják a légierőt, ha idegen gép lép a légtérbe.</p>
<h3>Folyók</h3>
<table><thead><tr><th>Eset</th><th>A határ</th></tr></thead><tbody><tr><td>hajózható folyó</td><td><strong>sodorvonal</strong> – nem feltétlenül a meder közepe!</td></tr><tr><td>nem hajózható folyó</td><td>a folyó <strong>közepe</strong></td></tr><tr><td>tó</td><td>a határ áthalad rajta</td></tr></tbody></table>
<p>Két hibaforrás: a hajózhatóság a döntő szempont, és a sodorvonal nem azonos a felezővonallal.</p>
<h3>Tenger</h3>
<p>A tektonikai lemezekhez igazodik: <strong>a szárazföldi lemez végétől</strong> (nem a parttól!) számított <strong>200 tengeri mérföldig</strong> terjed a halászati és kitermelési jog és a joghatóság.</p>
<h3>Légtér és a föld méhe</h3>
<p>Felfelé a világűr határáig: a <strong>Kármán-vonal</strong> 100 km magasan van (Kármán Tódor). A világűrben és az égitesteken senkinek nincs területe. Lefelé nem függőlegesen megyünk (a Föld geoid), hanem az államé az, amit <strong>a határvonalak és a Föld középpontja</strong> bezárnak. A föld méhének kincsei állami tulajdonban vannak.</p>
<h3>Repülők, hajók</h3>
<p>A <strong>lajstromjelzés</strong> csak a <strong>nemzetközi térben</strong> számít. Ha a magyar gép Budapesten áll, magyar területen vagy; ha nemzetközi vizek felett repül, a lajstromjelzés szerinti állam területén.</p>
<h3>Nagykövetség</h3>
<p>A leggyakoribb tévedés, hogy a követség a küldő állam területe. <strong>Nem az.</strong> Ami érvényesül, az a <strong>bécsi egyezmény szerinti diplomáciai mentesség</strong>: csak engedéllyel lehet belépni, a küldő állam joga irányadó, a fogadó állam hatóságai nem léphetnek be. Ezért tudott <strong>Mindszenty József</strong> az amerikai követségre menekülni.</p>`,
 tldr:["Hajózható folyó: sodorvonal; nem hajózható: közép","Tenger: a lemez végétől 200 tengeri mérföld","Légtér: Kármán-vonal, 100 km","Lajstromjelzés csak nemzetközi térben","Követség: fogadó állam területe + diplomáciai mentesség"],
 vizsga:["Hol a határ egy hajózható folyón?","Kinek a területe a budapesti amerikai nagykövetség?"]},

{id:16, rovat:"allam", lecke:16, min:5,
 title:"Katalónia nem írhat ki függetlenségi népszavazást – Texas elvben kiléphetne",
 lead:"Unitárius, föderatív vagy regionális? Egyetlen kérdés dönt: osztott-e a szuverenitás. Plusz szubszidiaritás és dekoncentráció, a rendőrségen bemutatva.",
 quote:"A decentralizáció nem szuverenitás.",
 body:`<h3>Unitárius állam</h3>
<p>A szuverenitás <strong>osztatlan</strong>, csak az államé. A régió, vármegye, település pusztán közigazgatási egység: nem alkothat államot, nem szakadhat ki. Ilyen Magyarország.</p>
<p><strong>Centralizált</strong> (Magyarország): oktatás, egészségügy, rendészet egységesen, a központ dönt. <strong>Decentralizált</strong> (Franciaország): bizonyos feladatokat független egységekre bíz – a francia helyi rendvédelmet a decentralizált egységek maguk szervezik. Ez sem szuverenitás, csak működésszervezés.</p>
<p><strong>Szubszidiaritás:</strong> a feladatot ott kell ellátni, ahol a leghatékonyabb és a legközelebb van a problémához. Ha a faluban kiönt a patak, helyben kell gátat építeni. Ezért centralizált államban is vannak decentralizált egységek – nálunk a <strong>helyi önkormányzatok</strong> –, és ettől az állam nem lesz decentralizált.</p>
<p><strong>Dekoncentráció:</strong> a központi feladat vertikális tagolása: Országos Rendőr-főkapitányság → vármegyei kapitányságok → városi kapitányságok, őrsök, körzeti megbízottak. A verekedéshez a legközelebbi városból jön a rendőr, nem Budapestről.</p>
<h3>Föderatív állam</h3>
<p>A szuverenitás <strong>osztott</strong>: a tagállamnak saját kormánya, törvényhozása, <strong>saját alkotmánya</strong> is lehet. <strong>Egyesítő föderáció</strong>: szuverén egységek hoznak létre közös államot (USA, Németország). Az USA-ban a büntetőpolitika tagállami – ezért van, ahol létezik halálbüntetés, és ahol nem. <strong>Szétválasztó föderáció</strong>: a közös állam ad át szuverenitást (Belgium). Működésben nincs különbség. Elvben a tagállam kiléphetne – az amerikai alkotmány ezt kifejezetten tiltja.</p>
<h3>Regionális állam</h3>
<p>Köztes: <strong>osztatlan szuverenitás</strong>, de széles mozgástér – saját kormány, sőt törvényhozás is, <strong>alkotmány nem</strong>. Ez nem szuverenitás, hanem <strong>autonómia</strong>: a központ adja, és a központ határozza meg a terjedelmét. Ezért adtak ki elfogatóparancsot a katalán elnök ellen, aki egyoldalúan írt ki függetlenségi népszavazást: ahhoz a központ hozzájárulása kellett volna.</p>
<table><thead><tr><th></th><th>Unitárius</th><th>Regionális</th><th>Föderatív</th></tr></thead><tbody>
<tr><td>Szuverenitás</td><td>osztatlan</td><td>osztatlan</td><td>osztott</td></tr>
<tr><td>Saját alkotmány</td><td>nincs</td><td>nincs</td><td>van</td></tr>
<tr><td>Példa</td><td>Magyarország, Franciaország</td><td>Spanyolország, Olaszország</td><td>USA, Németország, Belgium</td></tr></tbody></table>`,
 tldr:["A kérdés: osztott-e a szuverenitás","Unitárius: centralizált vagy decentralizált","Szubszidiaritás → önkormányzatok; dekoncentráció → rendőrség szintjei","Föderáció: egyesítő vagy szétválasztó, saját alkotmány","Regionális: autonómia, alkotmány nélkül"],
 vizsga:["Határold el a három államszerkezetet!","Mi a szubszidiaritás és a dekoncentráció?","Miért nem írhat ki Katalónia függetlenségi népszavazást?"]},

{id:17, rovat:"allam", lecke:17, min:3,
 title:"Az EU nem állam, a schengeni övezetnek pedig semmi köze az uniós joghoz",
 lead:"Két mondat, amit a vizsgán sokan elrontanak. Hatáskörmegosztás, nem szuverenitásmegosztás – és miért lehet visszaállítani a határellenőrzést.",
 quote:"Aki az Uniót a föderatív vagy a regionális állam kategóriájába próbálja beilleszteni, fogalmi hibát követ el.",
 body:`<p>Az Európai Unió <strong>nem állam</strong>, ezért az államszerkezeti tipológiában nem is értelmezhető. Nemzetközi szerződéssel létrehozott <strong>szupranacionális nemzetközi szervezet</strong>, közös alapja az <em>acquis communautaire</em>, a közös elvek és vívmányok összessége.</p>
<p>A gazdasági integráció mély: közös piac, közös vámpolitika, az <strong>áru, a tőke és a munkaerő szabad áramlása</strong>. A politikai integráció törekvései tartós nemzetállami ellenállásba ütköznek.</p>
<p class="kiemel"><strong>A kulcstétel:</strong> nem szuverenitásmegosztás, hanem <strong>hatáskörmegosztás</strong>. Hogy a vámpolitikában csak az EU dönt, az nem azért van, mert szuverén, hanem mert a tagállamok így határoztak.</p>
<h3>Schengen külön út</h3>
<p>A schengeni övezet <strong>külön nemzetközi egyezményen</strong> alapul: a szabad áramlást a határellenőrzés lebontásával tették teljessé. Ebből három következmény:</p>
<ul><li>aki EU-tag lesz, <strong>nem kerül be automatikusan</strong>;</li><li>schengeni tag csak uniós tag lehet, de <strong>nem minden uniós tag</strong> schengeni;</li><li>egy állam <strong>egyoldalúan felfüggesztheti</strong> az együttműködést, és visszaállíthatja a határellenőrzést (példa: a Ceuta és Melilla körüli migrációs helyzet).</li></ul>`,
 tldr:["EU: szupranacionális szervezet, nem állam","Hatáskör-, nem szuverenitásmegosztás","Schengen: külön egyezmény, nem automatikus, felfüggeszthető"],
 vizsga:["Hova sorolható az EU az államszerkezetek között?","Mi a schengeni együttműködés jogi alapja?"]},

{id:18, rovat:"allam", lecke:18, min:3,
 title:"Két metsző kör: miért nem ugyanaz a nép és a nemzet",
 lead:"Az angol mindkettőre a nation szót mondja, a magyar alkotmányjog szétválasztja. És mit jelent, hogy az állam „felelősséget visel” a határon túli magyarokért?",
 quote:"A helyes kép két metsző halmaz.",
 body:`<p>A magyar nyelv és alkotmányjog megkülönbözteti, amit a legtöbb nyelv egy szóval mond.</p>
<ul><li><strong>Nép:</strong> a B) cikk szerint <em>a közhatalom forrása a nép</em>.</li>
<li><strong>Politikai nemzet:</strong> akiket közjogi kötelék köt az államhoz – lényegében az állampolgárok. A politikai nemzet azonos a néppel.</li>
<li><strong>Kulturális nemzet:</strong> akiket nyelv, származás, magyar identitás köt össze, állampolgárságtól függetlenül.</li></ul>
<p>A két halmaz <strong>metszi egymást</strong>, egyik sem része a másiknak: a népben vannak olyan állampolgárok, akik kulturálisan nem tartoznak a nemzethez; a kulturális nemzetben vannak, akiknek nincs magyar állampolgárságuk. A metszetben a magyar identitású magyar állampolgárok állnak.</p>
<h3>Államcél</h3>
<p>Az Alaptörvény szerint az állam <strong>felelősséget visel a határon túli magyarokért</strong> – ez <strong>államcél</strong>: nem kikényszeríthető kötelezettség. Az állam törekszik, vállal, támogat, de bíróságon nem perelhető. Ugyanígy a megfelelő lakhatáshoz való jog: ha alanyi jog volna, minden hajléktalan perelhetne ingyenes lakást.</p>
<p>Tartalma: az identitás megőrzése, anyanyelvi oktatás kétoldalú megállapodásokkal (ukrán viszonylatban régi konfliktus), kedvezmények, támogatás.</p>
<p>Eszköze a <strong>2001-es státusztörvény</strong>: a határon túli magyarok <strong>magyar igazolványt</strong> igényelhetnek, állampolgárságtól függetlenül.</p>`,
 tldr:["Nép = politikai nemzet = állampolgárok","Kulturális nemzet: nyelv, származás, identitás","Két metsző halmaz","Államcél: nem kikényszeríthető","2001: státusztörvény, magyar igazolvány"],
 vizsga:["Határold el a nép, a politikai és a kulturális nemzet fogalmát!","Mi az államcél? Példa?"]}
];
